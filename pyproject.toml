[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "price-check-assistant"
version = "0.1.0"
description = "Public-price search and review assistant PoC for purchasing workflows"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.40,<2",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "pypdf>=6.17,<7",
  "pdfplumber>=0.11,<1",
  "pypdfium2>=5.9,<6",
  "pytesseract>=0.3.13,<1",
  "httpx>=0.27,<1",
  "tenacity>=9,<10",
  "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
  "xlwt>=1.3,<2",
  "reportlab>=4,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
