services:
  db:
    image: postgres:16-alpine
    container_name: purchase-price-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-purchase_price}
      POSTGRES_USER: ${POSTGRES_USER:-purchase_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-purchase_pass}
    ports:
      - "5432:5432"
    volumes:
      - purchase_price_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-purchase_user} -d ${POSTGRES_DB:-purchase_price}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  purchase_price_pgdata:
