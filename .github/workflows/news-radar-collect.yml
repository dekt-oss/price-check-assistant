name: News Radar Collect

# Every 30 minutes: search the News Radar keywords on NAVER and update news/v1/index.json.gz
# in R2 (the Streamlit app only reads it). 08:30 KST: write the daily digest of "하루 1회 요약"
# keywords to news/v1/digest/YYYY-MM-DD.md and the step summary.
# NAVER results are display-only (2026-09-07 terms): no AI step, 21-day retention.

on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: collect (search and update the list) or digest (daily summary)
        required: true
        default: collect
        type: choice
        options:
          - collect
          - digest

permissions:
  contents: read

jobs:
  collect:
    if: >-
      ${{ (github.event_name == 'schedule' && github.event.schedule == '*/30 * * * *') ||
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'collect') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One writer of the article list at a time; a queued run waits instead of overlapping.
    concurrency:
      group: news-radar-collect
      cancel-in-progress: false
    env:
      PYTHONPATH: src
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      NEWS_ALERT_WEBHOOK_URL: ${{ secrets.NEWS_ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install collector dependencies
        run: >-
          python -m pip install
          "pydantic>=2.8,<3"
          "pydantic-settings>=2.4,<3"
          "boto3>=1.35,<2"
          "httpx>=0.27,<1"
      - name: Collect NAVER news into R2
        run: >-
          python -m purchase_price.scripts.collect_news_radar
          --mode collect
          --summary-json artifacts/news-radar/collect.json
      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: news-radar-collect
          path: artifacts/news-radar/
          if-no-files-found: warn
          retention-days: 3

  daily-digest:
    if: >-
      ${{ (github.event_name == 'schedule' && github.event.schedule == '30 23 * * *') ||
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'digest') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only reads the article list and writes digest files, so it never blocks the collector.
    concurrency:
      group: news-radar-digest
      cancel-in-progress: false
    env:
      PYTHONPATH: src
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install digest dependencies
        run: >-
          python -m pip install
          "pydantic>=2.8,<3"
          "pydantic-settings>=2.4,<3"
          "boto3>=1.35,<2"
          "httpx>=0.27,<1"
      - name: Write the daily digest to R2 and the step summary
        run: >-
          python -m purchase_price.scripts.collect_news_radar
          --mode digest
          --summary-json artifacts/news-radar/digest.json
