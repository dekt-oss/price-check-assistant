name: R2 Search Recall UAT

on:
  workflow_dispatch:
  schedule:
    # 20:30 UTC Sunday = 05:30 KST Monday, after base + supplemental serving sync.
    - cron: "30 20 * * 0"
  pull_request:
    paths:
      - ".github/workflows/r2-search-recall-uat.yml"
      - "data/uat/r2-search-recall-cases.json"
      - "data/manufacturer_aliases.csv"
      - "data/model_aliases.csv"
      - "src/purchase_price/services/product_matching.py"
      - "src/purchase_price/scripts/measure_r2_search_recall.py"
      - "src/purchase_price/scripts/diagnose_r2_zero_recall.py"
      - "src/purchase_price/scripts/inspect_r2_promotion_sources.py"
      - "src/purchase_price/scripts/probe_g2b_promotion_catalog.py"
      - "src/purchase_price/scripts/audit_r2_broad_reference_composition.py"
      - "src/purchase_price/scripts/measure_r2_observed_model_recall.py"
      - "src/purchase_price/scripts/measure_g2b_external_research_rescue.py"
      - "data/g2b_product_mappings.csv"
      - "src/purchase_price/services/track_b_r2_quote_index.py"
      - "src/purchase_price/services/track_b_db_quote_comparison.py"
      - "tests/test_measure_r2_search_recall.py"
      - "tests/test_diagnose_r2_zero_recall.py"
      - "tests/test_inspect_r2_promotion_sources.py"
      - "tests/test_probe_g2b_promotion_catalog.py"
      - "tests/test_audit_r2_broad_reference_composition.py"
      - "tests/test_measure_r2_observed_model_recall.py"
      - "tests/test_measure_g2b_external_research_rescue.py"

permissions:
  contents: read

jobs:
  recall-uat:
    name: read-only Production R2 recall measurement
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      G2B_CATALOG_SERVICE_KEY: ${{ secrets.G2B_CATALOG_SERVICE_KEY }}
      G2B_RESEARCH_SERVICE_KEY: ${{ secrets.G2B_RESEARCH_SERVICE_KEY }}
      DATA_GO_KR_MARKET_SERVICE_KEY: ${{ secrets.DATA_GO_KR_MARKET_SERVICE_KEY }}
      G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run deterministic recall unit tests
        run: >-
          pytest -q
          tests/test_measure_r2_search_recall.py
          tests/test_diagnose_r2_zero_recall.py
          tests/test_inspect_r2_promotion_sources.py
          tests/test_probe_g2b_promotion_catalog.py
          tests/test_audit_r2_broad_reference_composition.py
          tests/test_measure_r2_observed_model_recall.py
          tests/test_measure_g2b_external_research_rescue.py
      - name: Measure Production R2 recall without writes
        run: >-
          python -m purchase_price.scripts.measure_r2_search_recall
          --manifest data/uat/r2-search-recall-cases.json
          --output artifacts/r2-search-recall/report.json
          --summary artifacts/r2-search-recall/summary.md
      - name: Verify external G2B Research rescue
        run: >-
          python -m purchase_price.scripts.measure_g2b_external_research_rescue
          --recall-report artifacts/r2-search-recall/report.json
          --output artifacts/r2-search-recall/external-research-rescue.json
          --summary artifacts/r2-search-recall/external-research-rescue.md
      - name: Measure 24 observed-model Production R2 cases
        run: >-
          python -m purchase_price.scripts.measure_r2_observed_model_recall
          --target-count 24
          --exclude-manifest data/uat/r2-search-recall-cases.json
          --output artifacts/r2-search-recall/observed-model-report.json
          --summary artifacts/r2-search-recall/observed-model-summary.md
      - name: Inspect raw R2 promotion-candidate sources
        run: >-
          python -m purchase_price.scripts.inspect_r2_promotion_sources
          --recall-report artifacts/r2-search-recall/report.json
          --output artifacts/r2-search-recall/promotion-source-inspection.json
          --summary artifacts/r2-search-recall/promotion-source-inspection.md
      - name: Probe official G2B catalog for promotion candidate IDs
        run: >-
          python -m purchase_price.scripts.probe_g2b_promotion_catalog
          --inspection artifacts/r2-search-recall/promotion-source-inspection.json
          --output artifacts/r2-search-recall/promotion-catalog-probe.json
          --summary artifacts/r2-search-recall/promotion-catalog-probe.md
      - name: Audit broad-reference class composition
        run: >-
          python -m purchase_price.scripts.audit_r2_broad_reference_composition
          --recall-report artifacts/r2-search-recall/report.json
          --output artifacts/r2-search-recall/broad-reference-composition.json
          --summary artifacts/r2-search-recall/broad-reference-composition.md
      - name: Diagnose Production R2 ZERO causes
        run: >-
          python -m purchase_price.scripts.diagnose_r2_zero_recall
          --recall-report artifacts/r2-search-recall/report.json
          --output artifacts/r2-search-recall/zero-diagnostic.json
          --summary artifacts/r2-search-recall/zero-diagnostic.md
      - name: Print recall and ZERO diagnostic summaries
        if: always()
        run: |
          if [ -f artifacts/r2-search-recall/summary.md ]; then
            cat artifacts/r2-search-recall/summary.md
          fi
          if [ -f artifacts/r2-search-recall/external-research-rescue.md ]; then
            cat artifacts/r2-search-recall/external-research-rescue.md
          fi
          if [ -f artifacts/r2-search-recall/observed-model-summary.md ]; then
            cat artifacts/r2-search-recall/observed-model-summary.md
          fi
          if [ -f artifacts/r2-search-recall/promotion-source-inspection.md ]; then
            cat artifacts/r2-search-recall/promotion-source-inspection.md
          fi
          if [ -f artifacts/r2-search-recall/promotion-catalog-probe.md ]; then
            cat artifacts/r2-search-recall/promotion-catalog-probe.md
          fi
          if [ -f artifacts/r2-search-recall/broad-reference-composition.md ]; then
            cat artifacts/r2-search-recall/broad-reference-composition.md
          fi
          if [ -f artifacts/r2-search-recall/zero-diagnostic.md ]; then
            cat artifacts/r2-search-recall/zero-diagnostic.md
          fi
      - name: Upload recall evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2-search-recall-uat
          path: artifacts/r2-search-recall/
          if-no-files-found: warn
          retention-days: 14
