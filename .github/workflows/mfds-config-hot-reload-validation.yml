name: MFDS Config Hot Reload Validation

on:
  push:
    branches:
      - "fix/production-mfds-config-hot-reload"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install OCR system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q tests/test_mfds_recall.py tests/test_safety_support.py tests/test_quote_item_intelligence.py tests/test_streamlit_startup_smoke.py
      - run: pytest -q
