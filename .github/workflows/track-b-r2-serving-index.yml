name: Track B R2 Serving Index

on:
  pull_request:
    paths:
      - ".github/workflows/track-b-r2-serving-index.yml"
      - "src/purchase_price/scripts/sync_g2b_track_b_r2_index.py"
      - "src/purchase_price/scripts/audit_track_b_transition.py"
      - "src/purchase_price/scripts/audit_track_b_serving_conflicts.py"
      - "src/purchase_price/services/track_b_pipeline_state.py"
      - "src/purchase_price/services/track_b_supplemental_state.py"
      - "src/purchase_price/services/track_b_db_quote_comparison.py"
      - "src/purchase_price/storage/r2_serving_index.py"
      - "src/purchase_price/models.py"
      - "alembic/versions/0004_track_b_delivery_conditions.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/track-b-r2-serving-index.yml"
      - "src/purchase_price/scripts/sync_g2b_track_b_r2_index.py"
      - "src/purchase_price/scripts/audit_track_b_transition.py"
      - "src/purchase_price/services/track_b_r2_quote_index.py"
      - "src/purchase_price/services/track_b_db_quote_comparison.py"
      - "src/purchase_price/services/track_b_pipeline_state.py"
      - "src/purchase_price/storage/r2_serving_index.py"
      - "src/purchase_price/models.py"
      - "alembic/versions/0004_track_b_delivery_conditions.py"
  workflow_run:
    workflows:
      - "Track B Daily Backfill"
      - "Track B Supplemental Collection"
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      max_bootstrap_objects:
        description: Safety ceiling for initial R2 raw -> SQLite index bootstrap
        required: true
        default: "100000"

concurrency:
  # Production writer runs share track-b-r2-pipeline with collection. PR recovery checks are
  # read-only and use a separate group so PR workflows cannot cancel one another.
  group: ${{ github.event_name == 'pull_request' && format('track-b-index-pr-{0}', github.event.pull_request.number) || 'track-b-r2-pipeline' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  recovery-readiness:
    name: read-only legacy R2 recovery proof
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install read-only R2 dependencies
        run: >-
          python -m pip install
          "pydantic>=2.8,<3"
          "pydantic-settings>=2.4,<3"
          "sqlalchemy>=2,<3"
          "boto3>=1.35,<2"
          "httpx>=0.27,<1"
          "tenacity>=9,<10"
      - name: Verify legacy state recovery proof without writing R2
        run: |
          python - <<'PY'
          from purchase_price.config import Settings
          from purchase_price.services.track_b_pipeline_state import (
              BOOTSTRAP_LAST_OBJECT_KEY,
              BOOTSTRAP_MIN_R2_OBJECTS,
              STATE_NAME,
              TrackBPipelineState,
          )
          from purchase_price.storage.r2_reader import R2RawEvidenceReader
          from purchase_price.storage.r2_state import R2OperationalStateStore

          settings = Settings()
          if not settings.r2_configured:
              raise SystemExit("R2 repository secret set is incomplete")

          state_store = R2OperationalStateStore.from_settings(settings)
          reader = R2RawEvidenceReader.from_settings(settings)
          state_payload = state_store.read_json(STATE_NAME)
          if state_payload is not None:
              TrackBPipelineState.from_payload(state_payload)

          objects = reader.list_public_json(
              source_operation="getSpcifyPrdlstPrcureInfoList-page"
          )
          keys = {obj.key for obj in objects}
          proof_ok = (
              len(objects) >= BOOTSTRAP_MIN_R2_OBJECTS
              and BOOTSTRAP_LAST_OBJECT_KEY in keys
          )
          print(f"state_present={state_payload is not None}")
          print(f"raw_object_count={len(objects)}")
          print(f"legacy_bootstrap_proof={proof_ok}")
          if state_payload is None and not proof_ok:
              raise SystemExit(
                  "missing pipeline state cannot be safely recovered from current R2 evidence"
              )
          PY
      - name: Read-only transition status audit
        run: >-
          python -m purchase_price.scripts.audit_track_b_transition
          --output artifacts/track-b-transition-pr.json
      - name: Print read-only transition summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/track-b-transition-pr.json").read_text())
          print("phase=", report.get("phase"))
          print("acceptance_status=", report.get("acceptance_status"))
          print("issue_157_acceptance=", report.get("issue_157_acceptance"))
          print("historical=", report.get("historical"))
          print("rolling=", report.get("rolling"))
          print("serving_index=", report.get("serving_index"))
          PY
      - name: Audit current serving-index conflict quarantine
        run: >-
          python -m purchase_price.scripts.audit_track_b_serving_conflicts
          --sample-limit 30
          --output artifacts/track-b-serving-conflicts.json
      - name: Print serving conflict summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/track-b-serving-conflicts.json").read_text())
          print("status=", report.get("status"))
          print("conflict_row_count=", report.get("conflict_row_count"))
          print("conflict_event_count=", report.get("conflict_event_count"))
          print("max_conflicts_for_one_identity=", report.get("max_conflicts_for_one_identity"))
          print("priced_conflict_row_count=", report.get("priced_conflict_row_count"))
          print("top_detail_codes=", report.get("top_detail_codes"))
          print("transaction_months=", report.get("transaction_months"))
          PY
      - name: Upload read-only transition audit
        uses: actions/upload-artifact@v4
        with:
          name: track-b-transition-readonly
          path: |
            artifacts/track-b-transition-pr.json
            artifacts/track-b-serving-conflicts.json
          retention-days: 14
          if-no-files-found: error

  sync-index:
    if: >-
      ${{ github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' &&
           (github.event.workflow_run.conclusion == 'success' ||
            github.event.workflow_run.conclusion == 'failure')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: src
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install serving-index dependencies
        run: >-
          python -m pip install
          "sqlalchemy>=2,<3"
          "psycopg[binary]>=3.2,<4"
          "pydantic>=2.8,<3"
          "pydantic-settings>=2.4,<3"
          "boto3>=1.35,<2"
          "httpx>=0.27,<1"
          "tenacity>=9,<10"
      - name: Build or increment R2-hosted SQLite serving index
        run: >-
          python -m purchase_price.scripts.sync_g2b_track_b_r2_index
          --max-bootstrap-objects "${{ inputs.max_bootstrap_objects || '100000' }}"
          --output artifacts/track-b-daily/r2-serving-index.json
      - name: Verify R2 serving lookup with FLOW-C
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path

          from purchase_price.schemas import ProductQuery
          from purchase_price.services.track_b_r2_quote_index import lookup_track_b_quote_from_r2

          def snapshot(label, query, quote_unit_price=None):
              result = lookup_track_b_quote_from_r2(
                  query,
                  quote_unit_price=quote_unit_price,
              )
              return {
                  "label": label,
                  "status": result.status,
                  "examined": result.examined,
                  "candidate_count": len(result.candidates),
                  "reference_count": len(result.reference_candidates),
                  "suggestion_count": len(result.suggestions),
                  "candidate_prices": [str(item.price) for item in result.candidates[:5]],
                  "reference_prices": [str(item.price) for item in result.reference_candidates[:5]],
                  "suppliers": [item.supplier for item in result.candidates[:5]],
                  "demand_institutions": [
                      item.demand_institution for item in result.candidates[:5]
                  ],
              }

          payload = {
              "strict_quote": snapshot(
                  "Maquet FLOW-C quote",
                  ProductQuery(
                      product_name="가스 마취기(Anesthesia Machine)",
                      manufacturer="Maquet",
                      model_name="FLOW-C",
                      specification="Flow-C",
                  ),
                  Decimal("66000000"),
              ),
              "model_probe": snapshot(
                  "FLOW-C model-only probe",
                  ProductQuery(model_name="FLOW-C"),
              ),
          }
          output = Path("artifacts/track-b-daily/flow-c-serving-smoke.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, ensure_ascii=False, sort_keys=True))
          blocked = {"unavailable", "not_ingested"}
          if any(item["status"] in blocked for item in payload.values()):
              raise SystemExit("R2 serving index is not consumable after sync")
          PY
      - name: Audit historical to rolling transition
        run: >-
          python -m purchase_price.scripts.audit_track_b_transition
          --require-serving-synced
          --output artifacts/track-b-daily/transition-audit.json
      - name: Print transition acceptance summary
        if: always()
        run: |
          if [ -f artifacts/track-b-daily/transition-audit.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("artifacts/track-b-daily/transition-audit.json").read_text()
          )
          print("status=", report.get("status"))
          print("phase=", report.get("phase"))
          print("acceptance_status=", report.get("acceptance_status"))
          print("issue_157_acceptance=", report.get("issue_157_acceptance"))
          print("operational_acceptance=", report.get("operational_acceptance"))
          historical = report.get("historical") or {}
          rolling = report.get("rolling") or {}
          supplemental = report.get("supplemental") or {}
          serving = report.get("serving_index") or {}
          print("historical_cursor=", historical.get("cursor"))
          print("historical_remaining_codes=", historical.get("remaining_codes"))
          print("rolling_window=", rolling.get("window_begin"), "~", rolling.get("window_end"))
          print("rolling_cursor=", rolling.get("cursor"))
          print("rolling_covered_through=", rolling.get("covered_through"))
          print("rolling_cycles_completed=", rolling.get("cycles_completed"))
          print("supplemental_phase=", supplemental.get("phase"))
          print("supplemental_target_count=", supplemental.get("target_count"))
          print("supplemental_backfill_complete=", supplemental.get("backfill_complete"))
          print("supplemental_pending_object_count=", supplemental.get("pending_object_count"))
          print("supplemental_serving_ready=", supplemental.get("serving_ready"))
          print("serving_pointer_synced=", serving.get("historical_cursor_matches_pointer"))
          print("pending_object_count=", serving.get("pending_object_count"))
          PY
          fi
      - name: Upload sync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-b-r2-serving-index
          path: artifacts/track-b-daily/
          if-no-files-found: warn
          retention-days: 14
