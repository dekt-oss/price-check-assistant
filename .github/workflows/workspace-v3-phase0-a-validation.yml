name: Workspace V3 Phase0 A Validation

on:
  push:
    branches:
      - "feat/workspace-v3-phase0-a"
    paths:
      - ".github/workflows/workspace-v3-phase0-a-validation.yml"
      - "src/**"
      - "pages/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install OCR system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Phase 0 A targeted tests
        run: |
          pytest -q             tests/test_mfds_identity_index.py             tests/test_safety_support.py             tests/test_track_b_db_quote_comparison.py             tests/test_track_b_transaction_rows.py             tests/test_track_b_transactions_v3.py             tests/test_unified_search_state_contract.py
      - name: Streamlit startup
        run: pytest -q tests/test_streamlit_startup_smoke.py
