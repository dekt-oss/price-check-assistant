name: Workspace V3 Phase2 Quote Data Validation

on:
  push:
    branches:
      - "feat/workspace-v3-phase2-quote-data"

concurrency:
  group: workspace-v3-phase2-quote-data-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install OCR system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Phase 2 quote resilience contracts
        run: |
          pytest -q tests/test_quote_market_track_b_state.py tests/test_purchase_workspace_handoff.py tests/test_quote_review_state.py tests/test_workspace_v3_release_gate.py
      - name: Streamlit startup smoke
        run: pytest -q tests/test_streamlit_startup_smoke.py
      - name: Full pytest
        run: pytest -q
