name: Production Browser Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/production-browser-smoke.yml"
      - "scripts/production_browser_smoke.py"
      - "scripts/production_unified_search_smoke.py"
      - "scripts/production_search_audit.py"
      - "scripts/production_r2_runtime_diagnostic.py"
      - "scripts/production_quote_uat_smoke.py"
  push:
    branches: [main]
    paths:
      - "Home.py"
      - "pages/**"
      - "src/purchase_price/ui/**"
      - "src/purchase_price/services/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "packages.txt"
      - "packages.ocr.txt"
      - ".github/workflows/production-browser-smoke.yml"
      - "scripts/production_browser_smoke.py"
      - "scripts/production_unified_search_smoke.py"
      - "scripts/production_r2_runtime_diagnostic.py"
      - "scripts/production_quote_uat_smoke.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-browser-smoke
  cancel-in-progress: false

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRODUCTION_URL: https://bp-price-research.streamlit.app/
      # PRs run against the currently deployed main, so they must not require features that exist
      # only on the feature branch. Unified-search submission has its own stable Production check.
      EXPECT_QUOTE_UAT: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      EXPECT_QUOTE_IMAGES: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      EXPECT_UNIFIED_SEARCH: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser smoke dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "playwright>=1.55,<2" "openpyxl>=3.1,<4" "Pillow>=10,<12"
          python -m playwright install --with-deps chromium

      - name: Run production browser smoke
        run: python scripts/production_browser_smoke.py

      - name: Gate Production R2 runtime readiness
        if: github.event_name != 'pull_request'
        run: python scripts/production_r2_runtime_diagnostic.py --require-ready

      - name: Run Production DFM100 unified-search smoke
        if: github.event_name != 'pull_request'
        run: python scripts/production_unified_search_smoke.py

      - name: Run temporary Production multi-query search audit
        if: github.event_name == 'pull_request'
        run: python scripts/production_search_audit.py

      - name: Run production quote UAT upload smoke
        if: always()
        run: python scripts/production_quote_uat_smoke.py

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-smoke
          path: |
            artifacts/production-browser-smoke/
            artifacts/production-search-audit/
          if-no-files-found: warn
          retention-days: 14
