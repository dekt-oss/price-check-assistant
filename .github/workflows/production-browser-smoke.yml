name: Production Browser Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/production-browser-smoke.yml"
      - "scripts/production_browser_smoke.py"
  push:
    branches: [main]
    paths:
      - "Home.py"
      - "pages/**"
      - "src/purchase_price/ui/**"
      - "requirements.txt"
      - "packages.txt"
      - "packages.ocr.txt"
      - ".github/workflows/production-browser-smoke.yml"
      - "scripts/production_browser_smoke.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-browser-smoke
  cancel-in-progress: false

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRODUCTION_URL: https://bp-price-research.streamlit.app/
      # PRs run against the currently deployed main, so they must not require a page that is
      # only present on the feature branch. Push/manual runs target deployed main and do require it.
      EXPECT_QUOTE_UAT: ${{ github.event_name == 'pull_request' && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install "playwright>=1.55,<2"
          python -m playwright install --with-deps chromium

      - name: Run production browser smoke
        run: python scripts/production_browser_smoke.py

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-smoke
          path: artifacts/production-browser-smoke/
          if-no-files-found: warn
          retention-days: 14
