name: G2B Live Smoke

on:
  workflow_dispatch:
    inputs:
      detail_product_name:
        description: "나라장터 세부품명"
        required: true
        default: "제습기"
      begin_date:
        description: "조회 시작일 YYYYMMDD"
        required: true
        default: "20260714"
      end_date:
        description: "조회 종료일 YYYYMMDD"
        required: true
        default: "20260813"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
      # Workflow-local compatibility alias for older CLI entry points.
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY || secrets.DATA_GO_KR_SERVICE_KEY }}
      INPUT_DETAIL_PRODUCT_NAME: ${{ inputs.detail_product_name }}
      INPUT_BEGIN_DATE: ${{ inputs.begin_date }}
      INPUT_END_DATE: ${{ inputs.end_date }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Verify G2B secret
        shell: bash
        run: |
          if [ -z "$G2B_SERVICE_KEY" ] && [ -z "$DATA_GO_KR_SERVICE_KEY" ]; then
            echo "G2B_SERVICE_KEY or legacy DATA_GO_KR_SERVICE_KEY secret must be configured"
            exit 2
          fi

      - name: Probe specific-item procurement API
        shell: bash
        run: |
          python -m purchase_price.scripts.g2b_shopping_probe \
            getSpcifyPrdlstPrcureInfoList \
            --param pageNo=1 \
            --param numOfRows=1 \
            --param inqryDiv=1 \
            --param "inqryBgnDate=$INPUT_BEGIN_DATE" \
            --param "inqryEndDate=$INPUT_END_DATE" \
            --param inqryPrdctDiv=2 \
            --param fnlCntrctDlvrReqChgOrdYn=Y \
            --param "dtilPrdctClsfcNoNm=$INPUT_DETAIL_PRODUCT_NAME"
