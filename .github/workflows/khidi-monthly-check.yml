name: KHIDI Monthly Disclosure Check

# 1st of every month, 09:00 KST: is a newer fiscal year published on haspa.khidi.or.kr than the
# newest year in data/hospital_financial.csv? If so, open (or reuse) a GitHub issue with the load
# commands and send an email/webhook notice when those secrets exist. Data is never changed here.

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: khidi-monthly-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
      ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
      NEWS_ALERT_WEBHOOK_URL: ${{ secrets.NEWS_ALERT_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install check dependencies
        run: >-
          python -m pip install
          "pydantic>=2.8,<3"
          "pydantic-settings>=2.4,<3"
          "httpx>=0.27,<1"
      - name: Compare the site's newest year with the loaded data
        id: check
        run: python -m purchase_price.scripts.check_khidi_new_year --summary-json artifacts/khidi-check.json
      - name: Open an issue for the new year
        if: steps.check.outputs.new_year != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_YEAR: ${{ steps.check.outputs.new_year }}
        run: |
          title="회계정보 공시 ${NEW_YEAR}년 자료 공개 — Benchmark 적재 필요"
          if gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' | grep -q .; then
            echo "Issue already open."
          else
            gh issue create --title "$title" --body-file artifacts/khidi-new-year-issue.md
          fi
