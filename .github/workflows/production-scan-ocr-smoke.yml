name: Production Scan OCR Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/production_scan_ocr_smoke.py"
      - ".github/workflows/production-scan-ocr-smoke.yml"
  push:
    branches: [main]
    paths:
      - "scripts/production_scan_ocr_smoke.py"
      - ".github/workflows/production-scan-ocr-smoke.yml"
      - "src/purchase_price/services/tesseract_runtime.py"
      - "src/purchase_price/services/pdf_ocr.py"
      - "requirements.txt"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  production-scan-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_URL: https://bp-price-research.streamlit.app/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser and synthetic PDF dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "playwright>=1.55,<2" \
            "reportlab>=4,<5" \
            "pypdfium2>=5.9,<6" \
            "pypdf>=6.17,<7"
          python -m playwright install --with-deps chromium

      - name: Upload synthetic image-only PDF and verify Production OCR
        run: python scripts/production_scan_ocr_smoke.py

      - name: Upload Production scan OCR evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-scan-ocr-smoke
          path: artifacts/production-scan-ocr-smoke/
          retention-days: 14
          if-no-files-found: warn
