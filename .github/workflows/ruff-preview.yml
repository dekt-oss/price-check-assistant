name: Ruff Import Preview

on:
  push:
    branches: [ui/quote-review-s1-s3]

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.6
      - run: ruff check src/purchase_price/ui/quote_review_steps.py --select I --fix --diff
