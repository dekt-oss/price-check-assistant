name: Workspace V3 Phase0 B Validation

on:
  push:
    branches:
      - "feat/workspace-v3-phase0-ab"

concurrency:
  group: workspace-v3-phase0-b-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install OCR system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             tesseract-ocr             tesseract-ocr-kor             tesseract-ocr-eng
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Probe live R2 conditional lock contract
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          python - <<'PY'
          import os
          from purchase_price.config import Settings
          from purchase_price.storage.r2_state import R2OperationalStateStore

          settings = Settings()
          store = R2OperationalStateStore.from_settings(settings)
          name = f"validation/workspace-v3-phase0-b-{os.environ['GITHUB_RUN_ID']}"
          owner = f"run-{os.environ['GITHUB_RUN_ID']}"
          store.acquire_lock(name, owner=owner, ttl_seconds=300)
          assert store.read_json(name)["owner"] == owner
          assert store.release_lock(name, owner=owner) is True
          assert store.read_json(name) is None
          print("r2_conditional_lock_probe=success")
          PY
      - name: Phase 0 A+B targeted contracts
        run: |
          pytest -q \
            tests/test_mfds_identity_index.py \
            tests/test_safety_support.py \
            tests/test_track_b_db_quote_comparison.py \
            tests/test_track_b_transaction_rows.py \
            tests/test_track_b_transactions_v3.py \
            tests/test_unified_search_state_contract.py \
            tests/test_mfds_identity_status.py \
            tests/test_mfds_identity_runtime_safety.py \
            tests/test_r2_state.py \
            tests/test_track_b_r2_snapshot.py \
            tests/test_company_identity.py \
            tests/test_quote_upload_security.py
      - name: Streamlit startup smoke
        run: pytest -q tests/test_streamlit_startup_smoke.py
      - name: Full pytest
        run: pytest -q
