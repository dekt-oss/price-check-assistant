name: MFDS Recall Contract Probe

on:
  push:
    branches:
      - "feat/workspace-v3-phase2-retry-ux"
    paths:
      - ".github/workflows/mfds-recall-contract-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract official data.go.kr operation metadata
        shell: bash
        run: |
          python - <<'PY'
          import html
          import re
          import urllib.request

          url = "https://www.data.go.kr/data/15056785/openapi.do"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0 price-check-assistant-contract-probe"},
          )
          with urllib.request.urlopen(req, timeout=20) as response:
              text = response.read().decode("utf-8", errors="replace")

          decoded = html.unescape(text)
          patterns = [
              r'https?://apis\.data\.go\.kr/1471000/[^"\'<>\\\s]+',
              r'get[A-Za-z0-9_]{8,80}',
              r'Mdlp[A-Za-z0-9_]{8,100}',
          ]
          values = set()
          for pattern in patterns:
              values.update(re.findall(pattern, decoded))

          print("candidate_metadata_count=", len(values))
          for value in sorted(values):
              if value.startswith("get") or "Rtrvl" in value or "SleStpge" in value:
                  print("metadata=", value[:240])
          PY
