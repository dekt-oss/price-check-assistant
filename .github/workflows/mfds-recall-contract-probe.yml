name: MFDS Recall Contract Probe

on:
  push:
    branches:
      - "feat/workspace-v3-phase2-retry-ux"
    paths:
      - ".github/workflows/mfds-recall-contract-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MFDS_SERVICE_KEY: ${{ secrets.MFDS_SERVICE_KEY || secrets.DATA_GO_KR_MARKET_SERVICE_KEY || secrets.DATA_GO_KR_SERVICE_KEY }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify current MFDS recall service authorization
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          key = os.environ.get("MFDS_SERVICE_KEY", "").strip()
          if not key:
              raise SystemExit("MFDS secret unavailable")

          base = "https://apis.data.go.kr/1471000/MdlpRtrvlSleStpgeInfoService04"
          operation = "getTypeNameList04"
          params = urllib.parse.urlencode({
              "serviceKey": key,
              "pageNo": 1,
              "numOfRows": 1,
              "type": "json",
          })
          req = urllib.request.Request(f"{base}/{operation}?{params}", method="GET")

          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  status = response.status
                  body = response.read()
          except urllib.error.HTTPError as exc:
              status = exc.code
              body = exc.read()

          text = body.decode("utf-8", errors="replace")
          code = ""
          msg = ""
          total = None
          keys = []
          try:
              payload = json.loads(text)
          except Exception:
              payload = None
          if isinstance(payload, dict):
              response = payload.get("response", payload)
              if isinstance(response, dict):
                  header = response.get("header") or {}
                  body_obj = response.get("body") or {}
                  code = str(header.get("resultCode") or "")
                  msg = str(header.get("resultMsg") or "")
                  total = body_obj.get("totalCount")
                  items = body_obj.get("items")
                  if isinstance(items, dict):
                      item = items.get("item")
                      if isinstance(item, list) and item:
                          keys = sorted(item[0].keys())
                      elif isinstance(item, dict):
                          keys = sorted(item.keys())
              service = payload.get("OpenAPI_ServiceResponse")
              if isinstance(service, dict):
                  header = service.get("cmmMsgHeader") or {}
                  code = str(header.get("returnReasonCode") or code)
                  msg = str(header.get("errMsg") or header.get("returnAuthMsg") or msg)
          if not code:
              try:
                  root = ET.fromstring(text)
                  code = root.findtext(".//resultCode") or root.findtext(".//returnReasonCode") or ""
                  msg = root.findtext(".//resultMsg") or root.findtext(".//errMsg") or root.findtext(".//returnAuthMsg") or ""
              except Exception:
                  pass

          print(f"http={status} code={code!r} msg={msg[:120]!r} totalCount={total!r}")
          print("item_keys=", ",".join(keys))
          PY
