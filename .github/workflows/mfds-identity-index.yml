name: MFDS Identity Index

on:
  pull_request:
    paths:
      - ".github/workflows/mfds-identity-index.yml"
      - "src/purchase_price/config.py"
      - "src/purchase_price/services/mfds_identity_index.py"
      - "src/purchase_price/services/mfds_identity_r2.py"
      - "src/purchase_price/storage/r2_mfds_identity_index.py"
      - "src/purchase_price/scripts/sync_mfds_identity_index.py"
      - "pages/1_대시보드.py"
      - "tests/test_mfds_identity_index.py"
      - "tests/test_mfds_identity_workflow_contract.py"
      - "tests/test_unified_search_state_contract.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mfds-identity-index.yml"
      - "src/purchase_price/services/mfds_identity_index.py"
      - "src/purchase_price/services/mfds_identity_r2.py"
      - "src/purchase_price/storage/r2_mfds_identity_index.py"
      - "src/purchase_price/scripts/sync_mfds_identity_index.py"
  schedule:
    # Stable backfill mode: twice daily. GitHub scheduled runs may start later than the cron time.
    - cron: "23 0,12 * * *"
  workflow_dispatch:
    inputs:
      chunks:
        description: Number of checkpointed MFDS collection chunks in this run
        required: true
        default: "5"
      pages_per_chunk:
        description: MFDS pages per checkpoint chunk
        required: true
        default: "200"
      rows_per_page:
        description: Rows requested per MFDS page
        required: true
        default: "100"

concurrency:
  group: mfds-identity-index
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Verify identity index contracts
        run: |
          pytest -q tests/test_mfds_identity_index.py tests/test_mfds_identity_workflow_contract.py
          ruff check src/purchase_price/services/mfds_identity_index.py src/purchase_price/services/mfds_identity_r2.py src/purchase_price/storage/r2_mfds_identity_index.py src/purchase_price/scripts/sync_mfds_identity_index.py

  collect-and-publish:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: src
      MFDS_SERVICE_KEY: ${{ secrets.MFDS_SERVICE_KEY || secrets.DATA_GO_KR_MARKET_SERVICE_KEY || secrets.DATA_GO_KR_SERVICE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      MFDS_BACKFILL_CHUNKS: ${{ inputs.chunks || '5' }}
      MFDS_BACKFILL_PAGES_PER_CHUNK: ${{ inputs.pages_per_chunk || '200' }}
      MFDS_BACKFILL_ROWS_PER_PAGE: ${{ inputs.rows_per_page || '100' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Collect official MFDS identity pages in checkpointed stable mode
        run: |
          set -euo pipefail
          mkdir -p artifacts/mfds-identity
          for chunk in $(seq 1 "$MFDS_BACKFILL_CHUNKS"); do
            echo "::group::MFDS stable backfill chunk $chunk/$MFDS_BACKFILL_CHUNKS"
            output="artifacts/mfds-identity/sync-$chunk.json"
            python -m purchase_price.scripts.sync_mfds_identity_index               --max-pages "$MFDS_BACKFILL_PAGES_PER_CHUNK"               --rows-per-page "$MFDS_BACKFILL_ROWS_PER_PAGE"               --output "$output"

            status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$output")"
            echo "chunk_status=$status"
            echo "::endgroup::"

            if [ "$status" != "SUCCESS" ]; then
              echo "::warning::Stopping this stable-mode run after chunk $chunk with status=$status"
              break
            fi
          done
      - name: Print collection status
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("artifacts/mfds-identity").glob("sync-*.json"))
          if not files:
              print("status=NO_REPORT")
              raise SystemExit(0)

          reports = [json.loads(path.read_text()) for path in files]
          latest = reports[-1]
          print("chunks_completed=", len(reports))
          print("statuses=", ",".join(str(item.get("status")) for item in reports))
          print("pages_collected=", sum(int(item.get("pages_collected") or 0) for item in reports))
          print("rows_seen=", sum(int(item.get("rows_seen") or 0) for item in reports))
          print("row_count=", latest.get("row_count"))
          print("next_page=", latest.get("next_page"))
          print("complete_cycles=", latest.get("complete_cycles"))
          print("source_total_count=", latest.get("source_total_count"))
          if any(item.get("status") == "SOURCE_NOT_AUTHORIZED" for item in reports):
              print("::warning::MFDS product-info API utilization approval is required for this service key.")
          PY
      - name: Upload collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mfds-identity-sync
          path: artifacts/mfds-identity/
          retention-days: 14
          if-no-files-found: warn
