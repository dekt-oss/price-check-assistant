name: OCR Readiness

on:
  pull_request:
  push:
    branches: [main]

jobs:
  synthetic-ocr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tesseract language packs
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-kor
      - name: Install project
        run: pip install -e .
      - name: Run real synthetic OCR readiness test
        run: pytest -q tests/test_ocr_execution_readiness_real.py
