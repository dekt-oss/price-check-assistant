name: OCR Readiness

on:
  pull_request:
  push:
    branches: [main]

jobs:
  bundled-ocr:
    runs-on: ubuntu-latest
    env:
      # Exercise the same apt-independent fallback required by Streamlit Community Cloud.
      PRICE_CHECK_TESSERACT_MODE: bundled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and test dependencies only
        run: pip install -e '.[dev]'
      - name: Run bundled runtime safeguards and real image-only PDF OCR
        run: |
          python -m pytest -q \
            tests/test_tesseract_runtime.py \
            tests/test_ocr_execution_readiness_real.py \
            tests/test_pdf_ocr_real_e2e.py
