name: G2B Track B Automation Live Backfill

on:
  push:
    branches:
      - feat/track-b-r2-backfill
    paths:
      - .github/workflows/track-b-automation-live.yml

permissions:
  contents: read

jobs:
  track-b-backfill:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      DATA_GO_KR_MARKET_SERVICE_KEY: ${{ secrets.DATA_GO_KR_MARKET_SERVICE_KEY }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install collector dependencies only
        run: |
          python -m pip install \
            "httpx>=0.27,<1" \
            "tenacity>=9,<10" \
            "pydantic>=2.8,<3" \
            "pydantic-settings>=2.4,<3" \
            "boto3>=1.35,<2"

      - name: Run bounded Track B backfill batch
        id: collect
        continue-on-error: true
        run: |
          python -m purchase_price.scripts.collect_g2b_track_b_r2 \
            --start-index 1709 \
            --start-page 1 \
            --request-budget 900 \
            --days 365 \
            --end-date 2026-09-11 \
            --target-code-snapshot artifacts/track-b-target-codes.json \
            --refresh-target-code-snapshot \
            --output artifacts/track-b-backfill/batch-003.json

      - name: Validate and print safe summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/track-b-backfill/batch-003.json")
          if not path.exists():
              raise SystemExit("Track B summary artifact was not created")
          report = json.loads(path.read_text(encoding="utf-8"))
          fields = (
              "status", "stop_reason", "target_code_count", "target_code_source",
              "target_code_snapshot_sha256", "total_requests", "dictionary_requests",
              "track_b_requests", "codes_completed", "pages_stored", "rows_seen",
              "r2_objects_created", "r2_objects_reused", "r2_stored_bytes_created",
              "next_cursor", "error_type", "error_message",
          )
          for field in fields:
              print(f"{field}=", report.get(field))
          stop = report.get("stop_reason")
          if stop in {"REQUEST_BUDGET_EXHAUSTED", "TARGET_COMPLETE", "RATE_LIMIT_EXHAUSTED"}:
              raise SystemExit(0)
          raise SystemExit(1)
          PY

      - name: Upload Track B backfill evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-b-backfill-batch-003
          path: |
            artifacts/track-b-backfill/batch-003.json
            artifacts/track-b-target-codes.json
          if-no-files-found: warn
          retention-days: 14
