name: G2B Targeted Shopping Live Validation

on:
  pull_request:
    paths:
      - ".github/workflows/g2b-targeted-shopping-live.yml"
      - "src/purchase_price/collectors/g2b_shopping.py"
      - "src/purchase_price/scripts/probe_g2b_targeted_shopping.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detail-code-search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      G2B_SHOPPING_SERVICE_KEY: ${{ secrets.G2B_SHOPPING_SERVICE_KEY }}
      DATA_GO_KR_MARKET_SERVICE_KEY: ${{ secrets.DATA_GO_KR_MARKET_SERVICE_KEY }}
      G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Probe CO2 incubator official detail-code history
        run: |
          python -m purchase_price.scripts.probe_g2b_targeted_shopping \
            --detail-product-code 4110449801 \
            --lookback-days 365 \
            --timeout-seconds 15 \
            --max-retries 1 \
            --output artifacts/g2b-targeted-shopping/report.json

      - name: Print safe summary
        if: always()
        run: |
          if [ -f artifacts/g2b-targeted-shopping/report.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/g2b-targeted-shopping/report.json").read_text())
          for key in (
              "validation_status",
              "detail_product_code",
              "begin_date",
              "end_date",
              "record_count",
              "reported_total_count",
              "wrong_detail_product_codes",
              "error_type",
              "error_message",
          ):
              print(f"{key}=", report.get(key))
          PY
          fi

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2b-targeted-shopping-live
          path: artifacts/g2b-targeted-shopping/report.json
          if-no-files-found: warn
          retention-days: 14
