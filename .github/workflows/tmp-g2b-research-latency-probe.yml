name: Temporary G2B Research Latency Probe

on:
  push:
    branches:
      - fix/g2b-research-latency-20261001

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: src
      G2B_SHOPPING_SERVICE_KEY: ${{ secrets.G2B_SHOPPING_SERVICE_KEY || secrets.G2B_SERVICE_KEY || secrets.DATA_GO_KR_MARKET_SERVICE_KEY || secrets.DATA_GO_KR_SERVICE_KEY }}
      G2B_RESEARCH_SERVICE_KEY: ${{ secrets.G2B_RESEARCH_SERVICE_KEY || secrets.DATA_GO_KR_MARKET_SERVICE_KEY || secrets.G2B_SERVICE_KEY || secrets.DATA_GO_KR_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Measure live 3-year bounded research latency
        run: |
          python - <<'PY'
          import os, time
          from datetime import date, timedelta
          from purchase_price.schemas import ProductQuery
          from purchase_price.services.g2b_contract_research import G2BContractResearchClient
          from purchase_price.services.g2b_unmapped_discovery import discover_unmapped_g2b_candidates

          today=date.today()
          begin=today-timedelta(days=1094)

          started=time.monotonic()
          client=G2BContractResearchClient(
              os.environ["G2B_RESEARCH_SERVICE_KEY"],
              timeout_seconds=12,
              max_retries=1,
          )
          contract=client.search_by_product_name_result(
              product_name="심장충격기",
              begin_date=begin,
              end_date=today,
              max_pages_per_window=1,
              max_workers=3,
          )
          contract_elapsed=time.monotonic()-started
          print(
              f"CONTRACT requests={contract.request_count} records={len(contract.records)} "
              f"failed_windows={contract.failed_window_count} elapsed={contract_elapsed:.2f}"
          )

          started=time.monotonic()
          discovery=discover_unmapped_g2b_candidates(
              ProductQuery(product_name="심장충격기", model_name="DFM100"),
              service_key=os.environ["G2B_SHOPPING_SERVICE_KEY"],
              lookback_days=1095,
              pages_per_term_window=1,
              request_budget=18,
              curated_terms=("심장충격기",),
              today=today,
              timeout_seconds=12,
              max_retries=1,
          )
          shopping_elapsed=time.monotonic()-started
          print(
              f"SHOPPING requests={discovery.request_count} status={discovery.status} "
              f"records_seen={discovery.records_seen} elapsed={shopping_elapsed:.2f}"
          )
          total=contract_elapsed+shopping_elapsed
          print(f"TOTAL elapsed={total:.2f}")
          if contract.failed_window_count:
              raise SystemExit(
                  f"contract windows incomplete: {contract.failed_window_count}"
              )
          if contract_elapsed > 45:
              raise SystemExit(f"contract latency too high: {contract_elapsed:.2f}s")
          if shopping_elapsed > 30:
              raise SystemExit(f"shopping latency too high: {shopping_elapsed:.2f}s")
          if total > 60:
              raise SystemExit(f"combined latency too high: {total:.2f}s")
          PY
