name: Quote Unified Search Parity Validation

on:
  push:
    branches:
      - "fix/quote-unified-search-parity"

concurrency:
  group: quote-unified-search-parity-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install OCR system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Quote parity contracts
        run: |
          pytest -q tests/test_purchase_workspace_handoff.py tests/test_quote_item_intelligence.py tests/test_structured_query_identity.py tests/test_quote_multi_item_partial_failure.py tests/test_production_unified_search_smoke_contract.py
      - name: Streamlit startup smoke
        run: pytest -q tests/test_streamlit_startup_smoke.py
      - name: Full pytest
        run: pytest -q
