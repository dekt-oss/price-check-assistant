name: Temporary Production Source Probe

on:
  push:
    branches:
      - fix/g2b-mfds-production-normalization-20261001

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: src
      G2B_SHOPPING_SERVICE_KEY: ${{ secrets.G2B_SHOPPING_SERVICE_KEY || secrets.G2B_SERVICE_KEY || secrets.DATA_GO_KR_MARKET_SERVICE_KEY || secrets.DATA_GO_KR_SERVICE_KEY }}
      G2B_RESEARCH_SERVICE_KEY: ${{ secrets.G2B_RESEARCH_SERVICE_KEY || secrets.DATA_GO_KR_MARKET_SERVICE_KEY || secrets.G2B_SERVICE_KEY || secrets.DATA_GO_KR_SERVICE_KEY }}
      MFDS_SERVICE_KEY: ${{ secrets.MFDS_SERVICE_KEY || secrets.DATA_GO_KR_MARKET_SERVICE_KEY || secrets.DATA_GO_KR_SERVICE_KEY }}
      MFDS_RECALL_SERVICE_KEY: ${{ secrets.MFDS_RECALL_SERVICE_KEY || secrets.MFDS_SERVICE_KEY || secrets.DATA_GO_KR_MARKET_SERVICE_KEY || secrets.DATA_GO_KR_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Probe official sources without exposing keys
        shell: bash
        run: |
          python - <<'PY'
          import os
          from datetime import date, timedelta
          from purchase_price.clients.data_go_kr import PublicDataPortalClient
          from purchase_price.collectors.g2b_shopping import G2B_SHOPPING_BASE_URL
          from purchase_price.services.g2b_contract_evidence import G2B_CONTRACT_BASE_URL, G2B_CONTRACT_PRODUCT_SEARCH_OPERATION
          from purchase_price.services.mfds_device_intelligence import MFDS_MODEL_INFO_BASE_URL, MFDS_MODEL_INFO_OPERATION
          from purchase_price.services.mfds_identity_index import MFDS_PRODUCT_INFO_BASE_URL, MFDS_PRODUCT_INFO_OPERATION
          from purchase_price.services.mfds_recall import MFDS_RECALL_BASE_URL, MFDS_RECALL_MODEL_OPERATION

          def probe(label, key, base, operation, **params):
              if not key:
                  print(f"{label}: NOT_CONFIGURED")
                  return
              try:
                  payload = PublicDataPortalClient(key, timeout_seconds=12, max_retries=1).get_json(base, operation, **params)
                  response = payload.get("response", payload)
                  body = response.get("body", {}) if isinstance(response, dict) else {}
                  total = body.get("totalCount") if isinstance(body, dict) else None
                  items = body.get("items") if isinstance(body, dict) else None
                  print(f"{label}: SUCCESS totalCount={total} items_type={type(items).__name__}")
              except Exception as exc:
                  print(f"{label}: FAILURE {type(exc).__name__}: {exc}")

          end = date.today()
          begin = end - timedelta(days=30)
          probe(
              "G2B_SHOPPING_31D",
              os.getenv("G2B_SHOPPING_SERVICE_KEY", ""),
              G2B_SHOPPING_BASE_URL,
              "getSpcifyPrdlstPrcureInfoList",
              pageNo=1, numOfRows=1, inqryDiv="1",
              inqryBgnDate=begin.strftime("%Y%m%d"), inqryEndDate=end.strftime("%Y%m%d"),
              inqryPrdctDiv="2", fnlCntrctDlvrReqChgOrdYn="Y",
              dtilPrdctClsfcNoNm="심장충격기",
          )
          probe(
              "G2B_CONTRACT_31D",
              os.getenv("G2B_RESEARCH_SERVICE_KEY", ""),
              G2B_CONTRACT_BASE_URL,
              G2B_CONTRACT_PRODUCT_SEARCH_OPERATION,
              pageNo=1, numOfRows=1, inqryDiv="1",
              inqryBgnDate=begin.strftime("%Y%m%d"), inqryEndDate=end.strftime("%Y%m%d"),
              prdctClsfcNoNm="심장충격기",
          )
          probe(
              "MFDS_OLD_MODEL",
              os.getenv("MFDS_SERVICE_KEY", ""),
              MFDS_MODEL_INFO_BASE_URL,
              MFDS_MODEL_INFO_OPERATION,
              PRDLST_NM="심장충격기", pageNo=1, numOfRows=10,
          )
          probe(
              "MFDS_STD_PRODUCT_NAME",
              os.getenv("MFDS_SERVICE_KEY", ""),
              MFDS_PRODUCT_INFO_BASE_URL,
              MFDS_PRODUCT_INFO_OPERATION,
              PRDLST_NM="심장충격기", pageNo=1, numOfRows=10,
          )
          probe(
              "MFDS_STD_MODEL",
              os.getenv("MFDS_SERVICE_KEY", ""),
              MFDS_PRODUCT_INFO_BASE_URL,
              MFDS_PRODUCT_INFO_OPERATION,
              FOML_INFO="Efficia DFM100", pageNo=1, numOfRows=10,
          )
          probe(
              "MFDS_RECALL",
              os.getenv("MFDS_RECALL_SERVICE_KEY", ""),
              MFDS_RECALL_BASE_URL,
              MFDS_RECALL_MODEL_OPERATION,
              type_name="Efficia DFM100", pageNo=1, numOfRows=10,
          )
          PY
