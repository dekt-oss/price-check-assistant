name: DB Collection PR-DB0 Live Feasibility

on:
  pull_request:
    paths:
      - ".github/workflows/db-collection-feasibility-live.yml"
      - "src/purchase_price/scripts/probe_db_collection_feasibility.py"
      - "tests/test_db_collection_feasibility_probe.py"
      - "docs/DB_COLLECTION_FEASIBILITY_202609.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      G2B_CATALOG_SERVICE_KEY: ${{ secrets.G2B_CATALOG_SERVICE_KEY }}
      G2B_SHOPPING_SERVICE_KEY: ${{ secrets.G2B_SHOPPING_SERVICE_KEY }}
      G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
      DATA_GO_KR_MARKET_SERVICE_KEY: ${{ secrets.DATA_GO_KR_MARKET_SERVICE_KEY }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Run bounded PR-DB0 probe
        run: |
          python -m purchase_price.scripts.probe_db_collection_feasibility \
            --output artifacts/db-collection-feasibility/report.json

      - name: Validate report schema and print safe summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/db-collection-feasibility/report.json")
          if not path.exists():
              raise SystemExit("PR-DB0 feasibility report missing")
          report = json.loads(path.read_text(encoding="utf-8"))
          required = {
              "unit10_dictionary",
              "track_a",
              "track_b",
              "track_c",
              "call_budget",
              "hosted_postgresql",
          }
          missing = sorted(required - report.keys())
          if missing:
              raise SystemExit(f"PR-DB0 feasibility report missing sections: {missing}")

          print("verified_at=", report.get("verified_at"))
          print("secrets_present=", report.get("secrets_present"))
          unit10 = report["unit10_dictionary"]
          print("unit10_full_enumeration=", unit10.get("full_enumeration", unit10.get("status")))
          print("unit10_total_count=", unit10.get("total_count"))
          print("track_a_date_only=", report["track_a"].get("date_only_contract", report["track_a"].get("status")))
          print("track_a_7d_count=", report["track_a"].get("seven_day_total_count"))
          print("track_b_exact_10_digit=", report["track_b"].get("exact_10_digit_contract", report["track_b"].get("status")))
          print("track_b_date_only=", report["track_b"].get("date_only_without_selector"))
          print("track_c_registration=", report["track_c"].get("registration_increment_contract", report["track_c"].get("status")))
          print("call_budget=", report["call_budget"])
          PY

      - name: Reject accidental service-key leakage
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/db-collection-feasibility/report.json ] && grep -Eqi 'serviceKey=[^*[:space:]]' artifacts/db-collection-feasibility/report.json; then
            echo "Potential service key leakage detected in feasibility artifact"
            exit 1
          fi

      - name: Upload feasibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-collection-feasibility-live
          path: artifacts/db-collection-feasibility/report.json
          if-no-files-found: error
          retention-days: 14
