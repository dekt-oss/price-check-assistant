name: Track B DB Real Validation

on:
  push:
    branches:
      - codex/quote-track-b-db-comparison
    paths:
      - .github/workflows/track-b-db-real-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      DATABASE_URL: sqlite+pysqlite:///:memory:
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: python -m pip install "sqlalchemy>=2,<3" "pydantic>=2.8,<3" "pydantic-settings>=2.4,<3" "boto3>=1.35,<2" "httpx>=0.27,<1" "tenacity>=9,<10"
      - name: Validate real R2 to DB quote lookup
        run: python -m purchase_price.scripts.validate_g2b_track_b_db_live --limit 50
