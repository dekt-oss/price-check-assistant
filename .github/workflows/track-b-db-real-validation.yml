name: Track B DB Real Validation

on:
  push:
    branches:
      - codex/quote-track-b-db-comparison
    paths:
      - .github/workflows/track-b-db-real-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: src
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: python -m pip install "sqlalchemy>=2,<3" "pydantic>=2.8,<3" "pydantic-settings>=2.4,<3" "boto3>=1.35,<2"
      - name: Audit every currently collected R2 object
        run: |
          python -m purchase_price.scripts.audit_g2b_track_b_r2 --limit 5000 > /tmp/track-b-full-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/track-b-full-audit.json').read_text())
          safe = {key: report.get(key) for key in (
              'status', 'objects_scanned', 'pages_parsed', 'invalid_pages', 'rows_seen',
              'normalized_records', 'price_candidates', 'non_price_records',
              'duplicate_pages', 'duplicate_records', 'issue_counts', 'price_counts',
              'identity_counts', 'amount_check_counts', 'has_more',
          )}
          print(json.dumps(safe, sort_keys=True))
          PY
      - name: Validate real R2 to DB quote lookup
        run: python -m purchase_price.scripts.validate_g2b_track_b_db_live --limit 50
