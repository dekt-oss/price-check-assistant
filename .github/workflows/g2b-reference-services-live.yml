name: G2B Catalog and Lifecycle Live Validation

on:
  pull_request:
    paths:
      - ".github/workflows/g2b-reference-services-live.yml"
      - "src/purchase_price/config.py"
      - "src/purchase_price/services/g2b_catalog.py"
      - "src/purchase_price/services/g2b_lifecycle.py"
      - "src/purchase_price/scripts/probe_g2b_reference_services.py"
      - "src/purchase_price/scripts/collect_g2b_track_b_r2.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-services:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      G2B_CATALOG_SERVICE_KEY: ${{ secrets.G2B_CATALOG_SERVICE_KEY }}
      G2B_LIFECYCLE_SERVICE_KEY: ${{ secrets.G2B_LIFECYCLE_SERVICE_KEY }}
      G2B_RESEARCH_SERVICE_KEY: ${{ secrets.G2B_RESEARCH_SERVICE_KEY }}
      DATA_GO_KR_MARKET_SERVICE_KEY: ${{ secrets.DATA_GO_KR_MARKET_SERVICE_KEY }}
      G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Probe official catalog and lifecycle services
        run: |
          python -m purchase_price.scripts.probe_g2b_reference_services \
            --product-id 24888744 \
            --bid-notice-no 20160234982 \
            --output artifacts/g2b-reference-services/report.json

      - name: Run first bounded Track B backfill batch
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/track-b-r2-backfill'
        run: |
          python -m purchase_price.scripts.collect_g2b_track_b_r2 \
            --start-index 0 \
            --start-page 1 \
            --request-budget 250 \
            --days 365 \
            --end-date 2026-09-11 \
            --output artifacts/track-b-backfill/batch-000.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/track-b-backfill/batch-000.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          print("track_b_status=", report.get("status"))
          print("stop_reason=", report.get("stop_reason"))
          print("total_requests=", report.get("total_requests"))
          print("codes_completed=", report.get("codes_completed"))
          print("pages_stored=", report.get("pages_stored"))
          print("rows_seen=", report.get("rows_seen"))
          print("r2_objects_created=", report.get("r2_objects_created"))
          print("r2_objects_reused=", report.get("r2_objects_reused"))
          print("r2_stored_bytes_created=", report.get("r2_stored_bytes_created"))
          print("next_cursor=", report.get("next_cursor"))
          if report.get("stop_reason") not in {"REQUEST_BUDGET_EXHAUSTED", "TARGET_COMPLETE"}:
              raise SystemExit(1)
          PY

      - name: Print safe summary
        if: always()
        run: |
          if [ -f artifacts/g2b-reference-services/report.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/g2b-reference-services/report.json").read_text())
          print("validation_status=", report.get("validation_status"))
          for name in ("catalog", "lifecycle"):
              row = report.get(name, {})
              print(
                  name,
                  "status=", row.get("status"),
                  "key_source=", row.get("key_source"),
                  "error_type=", row.get("error_type", ""),
                  "error_message=", row.get("error_message", ""),
              )
          PY
          fi

      - name: Upload Track B backfill evidence
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'feat/track-b-r2-backfill'
        uses: actions/upload-artifact@v4
        with:
          name: track-b-backfill-first-batch
          path: artifacts/track-b-backfill/batch-000.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2b-reference-services-live
          path: artifacts/g2b-reference-services/report.json
          if-no-files-found: warn
          retention-days: 14
