name: G2B Catalog and Lifecycle Live Validation

on:
  pull_request:
    paths:
      - ".github/workflows/g2b-reference-services-live.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  track-b-backfill-batch-005:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      G2B_CATALOG_SERVICE_KEY: ${{ secrets.G2B_CATALOG_SERVICE_KEY }}
      G2B_SHOPPING_SERVICE_KEY: ${{ secrets.G2B_SHOPPING_SERVICE_KEY }}
      G2B_RESEARCH_SERVICE_KEY: ${{ secrets.G2B_RESEARCH_SERVICE_KEY }}
      DATA_GO_KR_MARKET_SERVICE_KEY: ${{ secrets.DATA_GO_KR_MARKET_SERVICE_KEY }}
      G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Restore validated target-code snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10320004586/zip > /tmp/track-b-snapshot.zip
          unzip -p /tmp/track-b-snapshot.zip track-b-target-codes.json > /tmp/track-b-target-codes.json
          python - <<'PY'
          from pathlib import Path
          from purchase_price.services.g2b_target_code_snapshot import load_target_code_snapshot
          p = Path('/tmp/track-b-target-codes.json')
          snapshot = load_target_code_snapshot(p, expected_segments=('42','41','43','44','23','27','46','39'))
          expected = '0885d82d25beaa60eb740bca538253ce67a51234c20acd7ba05e40da9674b365'
          if snapshot.sha256 != expected:
              raise SystemExit(f'snapshot SHA mismatch: {snapshot.sha256}')
          if len(snapshot.codes) != 5208:
              raise SystemExit(f'unexpected code count: {len(snapshot.codes)}')
          print('snapshot_verified=', snapshot.sha256, 'codes=', len(snapshot.codes))
          PY

      - name: Collect Track B batch 005
        run: |
          mkdir -p artifacts/track-b-backfill
          set +e
          python -m purchase_price.scripts.collect_g2b_track_b_r2 \
            --start-index 3196 \
            --start-page 1 \
            --request-budget 900 \
            --days 365 \
            --end-date 2026-09-11 \
            --target-code-snapshot /tmp/track-b-target-codes.json \
            --output artifacts/track-b-backfill/batch-005.json
          rc=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/track-b-backfill/batch-005.json')
          if p.exists():
              s = json.loads(p.read_text())
              for k in ('status','target_code_source','target_code_snapshot_sha256','dictionary_requests','track_b_requests','codes_completed','pages_stored','rows_seen','r2_objects_created','r2_objects_reused','r2_stored_bytes_created','next_cursor','stop_reason','error_type','error_message'):
                  print(k, '=', s.get(k))
          PY
          exit "$rc"

      - name: Upload batch summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-b-backfill-batch-005
          path: artifacts/track-b-backfill/batch-005.json
          if-no-files-found: warn
          retention-days: 14
