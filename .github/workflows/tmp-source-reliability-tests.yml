name: TEMP Source Reliability Tests

on:
  push:
    branches:
      - fix/production-source-reliability-20260930
    paths:
      - ".github/workflows/tmp-source-reliability-tests.yml"

permissions:
  contents: read

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Compile modified runtime modules
        run: |
          python -m py_compile \
            "pages/1_대시보드.py" \
            src/purchase_price/services/g2b_contract_research.py \
            src/purchase_price/services/g2b_contract_enrichment.py \
            src/purchase_price/services/g2b_unmapped_discovery.py \
            src/purchase_price/services/mfds_workspace.py \
            src/purchase_price/services/safety_support.py \
            src/purchase_price/evidence_domain.py \
            "pages/5_의료기기_안전_공급사.py" \
            src/purchase_price/ui/market_research.py \
            src/purchase_price/ui/runtime_secrets.py

      - name: Run targeted regression tests
        run: |
          pytest -q \
            tests/test_g2b_contract_lookback_policy.py \
            tests/test_g2b_unmapped_discovery.py \
            tests/test_runtime_secrets.py \
            tests/test_mfds_workspace.py \
            tests/test_purchase_workspace_safety_contract.py \
            tests/test_safety_support.py \
            tests/test_unified_search_state_contract.py

      - name: Ruff modified files
        run: |
          ruff check \
            "pages/1_대시보드.py" \
            src/purchase_price/services/g2b_contract_research.py \
            src/purchase_price/services/g2b_contract_enrichment.py \
            src/purchase_price/services/g2b_unmapped_discovery.py \
            src/purchase_price/services/mfds_workspace.py \
            src/purchase_price/services/safety_support.py \
            src/purchase_price/evidence_domain.py \
            "pages/5_의료기기_안전_공급사.py" \
            src/purchase_price/ui/market_research.py \
            src/purchase_price/ui/runtime_secrets.py \
            tests/test_g2b_contract_lookback_policy.py \
            tests/test_g2b_unmapped_discovery.py \
            tests/test_runtime_secrets.py \
            tests/test_mfds_workspace.py \
            tests/test_purchase_workspace_safety_contract.py \
            tests/test_safety_support.py

