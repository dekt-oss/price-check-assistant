name: Workspace V3 Production Hot Reload Validation

on:
  push:
    branches:
      - "fix/workspace-v3-production-hot-reload-batch"

concurrency:
  group: workspace-v3-production-hot-reload-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install OCR system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Hot reload regressions
        run: pytest -q tests/test_track_b_hot_reload_imports.py tests/test_purchase_workspace_hot_reload.py tests/test_unified_search_state_contract.py
      - name: Streamlit startup smoke
        run: pytest -q tests/test_streamlit_startup_smoke.py
      - name: Full pytest
        run: pytest -q
