name: Track B Supplemental Verified Codes

on:
  pull_request:
    paths:
      - ".github/workflows/track-b-supplemental.yml"
      - "data/g2b_product_mappings.csv"
      - "src/purchase_price/scripts/collect_g2b_track_b_r2.py"
      - "src/purchase_price/scripts/run_g2b_track_b_supplemental.py"
      - "src/purchase_price/services/track_b_pipeline_state.py"
      - "src/purchase_price/services/track_b_supplemental_state.py"
      - "tests/test_track_b_r2_backfill.py"
      - "tests/test_track_b_pipeline_state.py"
      - "tests/test_track_b_supplemental_state.py"
  schedule:
    # 19:10 UTC = 04:10 KST next day, after the base Track B 03:10 KST run.
    - cron: "10 19 * * *"
  workflow_dispatch:
    inputs:
      request_budget:
        description: Maximum G2B requests for verified out-of-scope codes
        required: true
        default: "25"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('track-b-supplemental-pr-{0}', github.event.pull_request.number) || 'track-b-r2-pipeline' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contract:
    name: supplemental-code contract
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install contract dependencies
        run: >-
          python -m pip install
          "pydantic>=2.8,<3"
          "pydantic-settings>=2.4,<3"
          "boto3>=1.35,<2"
          "httpx>=0.27,<1"
          "tenacity>=9,<10"
      - name: Verify only evidence-backed codes escape the base segment set
        run: |
          python - <<'PY'
          from purchase_price.scripts.run_g2b_track_b_supplemental import (
              verified_supplemental_codes,
          )

          codes = verified_supplemental_codes()
          print("supplemental_codes=", codes)
          if "4511181101" not in codes:
              raise SystemExit("CX30N verified 영상모니터 code is missing")
          if any(code[:2] != "45" for code in codes):
              raise SystemExit("unexpected supplemental code segment")
          PY

  collect:
    name: bounded supplemental Track B collection
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      G2B_CATALOG_SERVICE_KEY: ${{ secrets.G2B_CATALOG_SERVICE_KEY }}
      G2B_SHOPPING_SERVICE_KEY: ${{ secrets.G2B_SHOPPING_SERVICE_KEY }}
      G2B_RESEARCH_SERVICE_KEY: ${{ secrets.G2B_RESEARCH_SERVICE_KEY }}
      DATA_GO_KR_MARKET_SERVICE_KEY: ${{ secrets.DATA_GO_KR_MARKET_SERVICE_KEY }}
      G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install collection dependencies
        run: >-
          python -m pip install
          "httpx>=0.27,<1"
          "tenacity>=9,<10"
          "pydantic>=2.8,<3"
          "pydantic-settings>=2.4,<3"
          "boto3>=1.35,<2"
      - name: Run verified-code supplemental collection
        run: >-
          python -m purchase_price.scripts.run_g2b_track_b_supplemental
          --request-budget "${{ inputs.request_budget || '25' }}"
          --output artifacts/track-b-supplemental/collection-summary.json
      - name: Upload supplemental collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-b-supplemental-collection
          path: artifacts/track-b-supplemental/
          if-no-files-found: warn
          retention-days: 14
