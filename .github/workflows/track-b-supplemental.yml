name: Track B Supplemental Collection

on:
  pull_request:
    paths:
      - ".github/workflows/track-b-supplemental.yml"
      - "src/purchase_price/scripts/collect_g2b_track_b_r2.py"
      - "src/purchase_price/scripts/run_g2b_track_b_supplemental.py"
      - "src/purchase_price/services/track_b_supplemental_state.py"
      - "src/purchase_price/services/track_b_supplemental_targets.py"
      - "src/purchase_price/scripts/sync_g2b_track_b_r2_index.py"
  schedule:
    # 19:40 UTC = 04:40 KST. Run after the 03:10 base Track B cycle and its serving sync.
    - cron: "40 19 * * *"
  workflow_dispatch:
    inputs:
      request_budget:
        description: Maximum G2B requests for verified supplemental codes
        required: true
        default: "50"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('track-b-supplemental-pr-{0}', github.event.pull_request.number) || 'track-b-r2-pipeline' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: >-
          python -m pip install
          "pytest>=8,<9"
          "httpx>=0.27,<1"
          "tenacity>=9,<10"
          "pydantic>=2.8,<3"
          "pydantic-settings>=2.4,<3"
          "boto3>=1.35,<2"
      - name: Verify supplemental target and state contracts
        run: >-
          pytest -q
          tests/test_track_b_supplemental_targets.py
          tests/test_track_b_supplemental_state.py

  collect:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      G2B_SHOPPING_SERVICE_KEY: ${{ secrets.G2B_SHOPPING_SERVICE_KEY }}
      G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install collection dependencies
        run: >-
          python -m pip install
          "httpx>=0.27,<1"
          "tenacity>=9,<10"
          "pydantic>=2.8,<3"
          "pydantic-settings>=2.4,<3"
          "boto3>=1.35,<2"
      - name: Run supplemental verified-code collection
        run: >-
          python -m purchase_price.scripts.run_g2b_track_b_supplemental
          --request-budget "${{ inputs.request_budget || '50' }}"
          --output artifacts/track-b-supplemental/collection-summary.json
      - name: Upload collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-b-supplemental-collection
          path: artifacts/track-b-supplemental/
          if-no-files-found: warn
          retention-days: 14
