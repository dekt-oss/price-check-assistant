name: Phase 0 Wider G2B Scan Once

on:
  push:
    branches:
      - ops/phase0-live-20260904
    paths:
      - .github/workflows/phase0-live-once.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      G2B_REQUEST_TIMEOUT_SECONDS: "30"
      G2B_MAX_RETRIES: "5"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify secret
        shell: bash
        run: |
          if [ -z "$DATA_GO_KR_SERVICE_KEY" ]; then
            echo "DATA_GO_KR_SERVICE_KEY secret is not configured"
            exit 2
          fi

      - name: Scan unresolved exact models over 2026 YTD
        shell: bash
        run: |
          python -m purchase_price.scripts.scan_g2b_exact_model_candidates \
            --begin-date "20260101" \
            --end-date "20260903" \
            --chunk-days "31" \
            --max-pages-per-chunk "20" \
            --model "Sophie" \
            --model "NT960XJG-K72AG" \
            --model "ThinkStation P2 Tower" \
            --summary-output artifacts/g2b-wide-scan/exact-model-summary.csv \
            --candidates-output artifacts/g2b-wide-scan/exact-model-candidates.csv

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2b-wide-scan-20260101-20260903
          path: artifacts/g2b-wide-scan/
          retention-days: 14
          if-no-files-found: error
