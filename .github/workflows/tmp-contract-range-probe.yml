name: Temporary Contract Range Probe

on:
  push:
    branches:
      - fix/g2b-research-latency-20261001

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
      G2B_RESEARCH_SERVICE_KEY: ${{ secrets.G2B_RESEARCH_SERVICE_KEY || secrets.DATA_GO_KR_MARKET_SERVICE_KEY || secrets.G2B_SERVICE_KEY || secrets.DATA_GO_KR_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Probe accepted contract date ranges
        run: |
          python - <<'PY'
          import os, time
          from datetime import date, timedelta
          from purchase_price.services.g2b_contract_research import G2BContractResearchClient

          client=G2BContractResearchClient(
              os.environ["G2B_RESEARCH_SERVICE_KEY"],
              timeout_seconds=30,
              max_retries=1,
          )
          end=date.today()
          for days in (31,90,180,365,366,730,1095):
              begin=end-timedelta(days=days-1)
              started=time.monotonic()
              try:
                  page=client.fetch_product_search_page(
                      product_name="심장충격기",
                      begin_date=begin,
                      end_date=end,
                      page_no=1,
                      num_of_rows=1,
                  )
                  elapsed=time.monotonic()-started
                  print(f"RANGE days={days} status=SUCCESS total={page.total_count} elapsed={elapsed:.2f}")
              except Exception as exc:
                  elapsed=time.monotonic()-started
                  print(
                      f"RANGE days={days} status=FAILURE type={type(exc).__name__} "
                      f"elapsed={elapsed:.2f} error={exc}"
                  )
          PY
