name: Track B Daily Backfill

on:
  pull_request:
    paths:
      - ".github/workflows/track-b-daily-backfill-postgres.yml"
      - "src/purchase_price/scripts/run_g2b_track_b_daily.py"
      - "src/purchase_price/services/track_b_pipeline_state.py"
      - "src/purchase_price/storage/r2_state.py"
  schedule:
    # GitHub cron is UTC. 18:10 UTC = 03:10 KST next day.
    - cron: "10 18 * * *"
  workflow_dispatch:
    inputs:
      request_budget:
        description: Maximum G2B requests for this backfill batch (hard cap 900)
        required: true
        default: "900"

concurrency:
  group: track-b-daily-backfill
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  readiness:
    name: R2 and G2B secret readiness
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
      G2B_CATALOG_SERVICE_KEY: ${{ secrets.G2B_CATALOG_SERVICE_KEY }}
      G2B_SHOPPING_SERVICE_KEY: ${{ secrets.G2B_SHOPPING_SERVICE_KEY }}
      G2B_RESEARCH_SERVICE_KEY: ${{ secrets.G2B_RESEARCH_SERVICE_KEY }}
      DATA_GO_KR_MARKET_SERVICE_KEY: ${{ secrets.DATA_GO_KR_MARKET_SERVICE_KEY }}
      G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install settings dependencies
        run: python -m pip install "pydantic>=2.8,<3" "pydantic-settings>=2.4,<3"
      - name: Verify production collection secret contract
        run: |
          python - <<'PY'
          from purchase_price.config import Settings

          settings = Settings()
          errors = []
          if not settings.r2_configured:
              errors.append("R2 repository secret set is incomplete")
          if not (settings.resolved_g2b_catalog_service_key or "").strip():
              errors.append("G2B catalog key fallback chain is unresolved")
          if not (settings.resolved_g2b_shopping_service_key or "").strip():
              errors.append("G2B shopping key fallback chain is unresolved")
          if errors:
              for error in errors:
                  print(f"::error::{error}")
              raise SystemExit(1)
          print("production_collection_contract=READY_R2")
          PY

  collect:
    name: bounded Track B backfill to R2
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: macos-14
    timeout-minutes: 70
    env:
      PYTHONPATH: src
      G2B_CATALOG_SERVICE_KEY: ${{ secrets.G2B_CATALOG_SERVICE_KEY }}
      G2B_SHOPPING_SERVICE_KEY: ${{ secrets.G2B_SHOPPING_SERVICE_KEY }}
      G2B_RESEARCH_SERVICE_KEY: ${{ secrets.G2B_RESEARCH_SERVICE_KEY }}
      DATA_GO_KR_MARKET_SERVICE_KEY: ${{ secrets.DATA_GO_KR_MARKET_SERVICE_KEY }}
      G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install collection dependencies
        run: >-
          python -m pip install
          "httpx>=0.27,<1"
          "tenacity>=9,<10"
          "pydantic>=2.8,<3"
          "pydantic-settings>=2.4,<3"
          "boto3>=1.35,<2"
      - name: Restore legacy validated snapshot bootstrap artifact when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/track-b-daily
          set +e
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10320004586/zip" \
            -o /tmp/track-b-target-snapshot.zip
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            unzip -p /tmp/track-b-target-snapshot.zip track-b-target-codes.json \
              > artifacts/track-b-daily/bootstrap-target-codes.json
          else
            rm -f artifacts/track-b-daily/bootstrap-target-codes.json
            echo "Legacy snapshot artifact unavailable; persisted R2 snapshot will be required."
          fi
      - name: Run resumable daily collection
        run: >-
          python -m purchase_price.scripts.run_g2b_track_b_daily
          --request-budget "${{ inputs.request_budget || '900' }}"
          --bootstrap-snapshot artifacts/track-b-daily/bootstrap-target-codes.json
          --output artifacts/track-b-daily/collection-summary.json
      - name: Upload collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-b-daily-collection
          path: artifacts/track-b-daily/
          if-no-files-found: warn
          retention-days: 14
