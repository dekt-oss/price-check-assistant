name: Track B Daily Backfill and PostgreSQL Sync

on:
  pull_request:
    paths:
      - ".github/workflows/track-b-daily-backfill-postgres.yml"
      - "src/purchase_price/scripts/run_g2b_track_b_daily.py"
      - "src/purchase_price/scripts/sync_g2b_track_b_postgres.py"
      - "src/purchase_price/services/track_b_pipeline_state.py"
      - "src/purchase_price/storage/r2_state.py"
  schedule:
    # GitHub cron is UTC. 18:10 UTC = 03:10 KST next day.
    - cron: "10 18 * * *"
  workflow_dispatch:
    inputs:
      request_budget:
        description: Maximum G2B requests for this backfill batch (hard cap 900)
        required: true
        default: "900"
      max_bootstrap_objects:
        description: Safety ceiling for the one-time full R2 -> PostgreSQL bootstrap
        required: true
        default: "100000"

concurrency:
  group: track-b-daily-backfill-postgres
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  readiness:
    name: production secret readiness
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      G2B_CATALOG_SERVICE_KEY: ${{ secrets.G2B_CATALOG_SERVICE_KEY }}
      G2B_SHOPPING_SERVICE_KEY: ${{ secrets.G2B_SHOPPING_SERVICE_KEY }}
      G2B_RESEARCH_SERVICE_KEY: ${{ secrets.G2B_RESEARCH_SERVICE_KEY }}
      DATA_GO_KR_MARKET_SERVICE_KEY: ${{ secrets.DATA_GO_KR_MARKET_SERVICE_KEY }}
      G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install settings dependencies
        run: python -m pip install "pydantic>=2.8,<3" "pydantic-settings>=2.4,<3"
      - name: Verify required production secret contract without revealing values
        run: |
          python - <<'PY'
          import os
          from purchase_price.config import Settings

          settings = Settings()
          errors = []
          database_url = (os.getenv("DATABASE_URL") or "").strip()
          if not database_url:
              print("::warning::DATABASE_URL repository secret is missing; daily R2 backfill remains enabled and PostgreSQL sync will be skipped")
              database_status = "NO_DATABASE"
          elif not database_url.startswith(("postgres://", "postgresql://", "postgresql+psycopg://")):
              errors.append("DATABASE_URL is not a supported PostgreSQL URL")
              database_status = "INVALID_DATABASE"
          else:
              database_status = "DATABASE_READY"
          if not settings.r2_configured:
              errors.append("R2 repository secret set is incomplete")
          if not (settings.resolved_g2b_catalog_service_key or "").strip():
              errors.append("G2B catalog key fallback chain is unresolved")
          if not (settings.resolved_g2b_shopping_service_key or "").strip():
              errors.append("G2B shopping key fallback chain is unresolved")
          if errors:
              for error in errors:
                  print(f"::error::{error}")
              raise SystemExit(1)
          print(f"production_secret_contract=READY_{database_status}")
          PY

  collect:
    name: bounded Track B backfill
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: macos-14
    timeout-minutes: 70
    env:
      PYTHONPATH: src
      G2B_CATALOG_SERVICE_KEY: ${{ secrets.G2B_CATALOG_SERVICE_KEY }}
      G2B_SHOPPING_SERVICE_KEY: ${{ secrets.G2B_SHOPPING_SERVICE_KEY }}
      G2B_RESEARCH_SERVICE_KEY: ${{ secrets.G2B_RESEARCH_SERVICE_KEY }}
      DATA_GO_KR_MARKET_SERVICE_KEY: ${{ secrets.DATA_GO_KR_MARKET_SERVICE_KEY }}
      G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install collection dependencies
        run: >-
          python -m pip install
          "httpx>=0.27,<1"
          "tenacity>=9,<10"
          "pydantic>=2.8,<3"
          "pydantic-settings>=2.4,<3"
          "boto3>=1.35,<2"
      - name: Restore legacy validated snapshot bootstrap artifact when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/track-b-daily
          set +e
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10320004586/zip" \
            -o /tmp/track-b-target-snapshot.zip
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            unzip -p /tmp/track-b-target-snapshot.zip track-b-target-codes.json \
              > artifacts/track-b-daily/bootstrap-target-codes.json
          else
            rm -f artifacts/track-b-daily/bootstrap-target-codes.json
            echo "Legacy snapshot artifact unavailable; persisted R2 snapshot will be required."
          fi
      - name: Run resumable daily collection
        run: >-
          python -m purchase_price.scripts.run_g2b_track_b_daily
          --request-budget "${{ inputs.request_budget || '900' }}"
          --bootstrap-snapshot artifacts/track-b-daily/bootstrap-target-codes.json
          --output artifacts/track-b-daily/collection-summary.json
      - name: Upload collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-b-daily-collection
          path: artifacts/track-b-daily/
          if-no-files-found: warn
          retention-days: 14

  postgres-sync:
    name: R2 to production PostgreSQL
    needs: collect
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: src
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Detect and normalize production PostgreSQL secret
        run: |
          mkdir -p artifacts/track-b-daily
          if [ -z "${DATABASE_URL}" ]; then
            echo "::warning::DATABASE_URL is not configured; preserving daily R2 backfill and skipping PostgreSQL sync."
            echo "SKIP_POSTGRES_SYNC=1" >> "$GITHUB_ENV"
            cat > artifacts/track-b-daily/postgres-sync.json <<'JSON'
          {"status":"SKIPPED","reason":"DATABASE_URL_MISSING","collection_continues":true}
          JSON
            exit 0
          fi
          case "${DATABASE_URL}" in
            postgresql+psycopg://*) ;;
            postgresql://*)
              echo "DATABASE_URL=postgresql+psycopg://${DATABASE_URL#postgresql://}" >> "$GITHUB_ENV"
              ;;
            postgres://*)
              echo "DATABASE_URL=postgresql+psycopg://${DATABASE_URL#postgres://}" >> "$GITHUB_ENV"
              ;;
            *) echo "DATABASE_URL must be PostgreSQL." >&2; exit 1 ;;
          esac
          echo "SKIP_POSTGRES_SYNC=0" >> "$GITHUB_ENV"
      - name: Install PostgreSQL sync dependencies
        if: ${{ env.SKIP_POSTGRES_SYNC != '1' }}
        run: >-
          python -m pip install
          "sqlalchemy>=2,<3"
          "alembic>=1.14,<2"
          "psycopg[binary]>=3.2,<4"
          "pydantic>=2.8,<3"
          "pydantic-settings>=2.4,<3"
          "boto3>=1.35,<2"
      - name: Apply serving migrations
        if: ${{ env.SKIP_POSTGRES_SYNC != '1' }}
        run: alembic upgrade head
      - name: Bootstrap or incrementally sync Track B serving index
        if: ${{ env.SKIP_POSTGRES_SYNC != '1' }}
        run: >-
          python -m purchase_price.scripts.sync_g2b_track_b_postgres
          --max-bootstrap-objects "${{ inputs.max_bootstrap_objects || '100000' }}"
          --output artifacts/track-b-daily/postgres-sync.json
      - name: Upload PostgreSQL sync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-b-postgres-sync
          path: artifacts/track-b-daily/
          if-no-files-found: warn
          retention-days: 14
