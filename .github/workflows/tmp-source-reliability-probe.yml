name: TEMP Source Reliability Probe

on:
  push:
    branches:
      - fix/production-source-reliability-20260930
    paths:
      - ".github/workflows/tmp-source-reliability-probe.yml"

permissions:
  contents: read

concurrency:
  group: temp-source-reliability-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      G2B_SHOPPING_SERVICE_KEY: ${{ secrets.G2B_SHOPPING_SERVICE_KEY || secrets.G2B_SERVICE_KEY || secrets.DATA_GO_KR_MARKET_SERVICE_KEY || secrets.DATA_GO_KR_SERVICE_KEY }}
      G2B_RESEARCH_SERVICE_KEY: ${{ secrets.G2B_RESEARCH_SERVICE_KEY || secrets.DATA_GO_KR_MARKET_SERVICE_KEY || secrets.DATA_GO_KR_SERVICE_KEY }}
      MFDS_SERVICE_KEY: ${{ secrets.MFDS_SERVICE_KEY || secrets.DATA_GO_KR_MARKET_SERVICE_KEY || secrets.DATA_GO_KR_SERVICE_KEY }}
      MFDS_RECALL_SERVICE_KEY: ${{ secrets.MFDS_RECALL_SERVICE_KEY || secrets.MFDS_SERVICE_KEY || secrets.DATA_GO_KR_MARKET_SERVICE_KEY || secrets.DATA_GO_KR_SERVICE_KEY }}

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe live public-data endpoints without printing keys
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import date, timedelta
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode, unquote
          from urllib.request import urlopen

          def call(label, base, op, key, **params):
              if not (key or "").strip():
                  print(label, "status=not_configured")
                  return
              query = {"serviceKey": unquote(key.strip()), "type": "json", **params}
              url = f"{base.rstrip('/')}/{op}?{urlencode(query)}"
              try:
                  with urlopen(url, timeout=20) as resp:
                      body = resp.read().decode("utf-8", "replace")
                      status = resp.status
              except HTTPError as exc:
                  body = exc.read().decode("utf-8", "replace")
                  status = exc.code
              except URLError as exc:
                  print(label, "status=transport_failure", type(exc).__name__, str(exc)[:200])
                  return
              summary = body[:500].replace("\n", " ")
              try:
                  payload = json.loads(body)
                  response = payload.get("response") if isinstance(payload, dict) else None
                  header = response.get("header", {}) if isinstance(response, dict) else {}
                  if not header and isinstance(payload, dict):
                      for k, v in payload.items():
                          if k.endswith("ResponseError") and isinstance(v, dict):
                              header = v.get("header", {})
                              break
                  code = header.get("resultCode") if isinstance(header, dict) else None
                  msg = header.get("resultMsg") if isinstance(header, dict) else None
                  body_obj = response.get("body", {}) if isinstance(response, dict) else {}
                  total = body_obj.get("totalCount") if isinstance(body_obj, dict) else None
                  print(label, f"http={status}", f"resultCode={code}", f"resultMsg={msg}", f"totalCount={total}")
              except Exception:
                  print(label, f"http={status}", "body=", summary)

          g2b_shop = os.getenv("G2B_SHOPPING_SERVICE_KEY", "")
          g2b_research = os.getenv("G2B_RESEARCH_SERVICE_KEY", "")
          mfds = os.getenv("MFDS_SERVICE_KEY", "")
          mfds_recall = os.getenv("MFDS_RECALL_SERVICE_KEY", "")

          end = date(2026, 9, 30)
          for days in (31, 365):
              begin = end - timedelta(days=days - 1)
              call(
                  f"shopping_심장충격기_{days}d",
                  "https://apis.data.go.kr/1230000/at/ShoppingMallPrdctInfoService",
                  "getSpcifyPrdlstPrcureInfoList",
                  g2b_shop,
                  pageNo=1,
                  numOfRows=1,
                  inqryDiv=1,
                  inqryBgnDate=begin.strftime("%Y%m%d"),
                  inqryEndDate=end.strftime("%Y%m%d"),
                  inqryPrdctDiv=2,
                  fnlCntrctDlvrReqChgOrdYn="Y",
                  dtilPrdctClsfcNoNm="심장충격기",
              )

          for days in (31, 90):
              begin = end - timedelta(days=days - 1)
              call(
                  f"contract_심장충격기_{days}d",
                  "https://apis.data.go.kr/1230000/ao/CntrctInfoService",
                  "getCntrctInfoListThngPPSSrch",
                  g2b_research,
                  pageNo=1,
                  numOfRows=1,
                  inqryDiv=1,
                  inqryBgnDate=begin.strftime("%Y%m%d"),
                  inqryEndDate=end.strftime("%Y%m%d"),
                  prdctClsfcNoNm="심장충격기",
              )

          for term in ("심장 충격기", "심장충격기"):
              call(
                  f"mfds_model_{term}",
                  "https://apis.data.go.kr/1471000/MdeqModlInfoService01",
                  "getMdeqModlInq01",
                  mfds,
                  pageNo=1,
                  numOfRows=10,
                  PRDLST_NM=term,
              )

          call(
              "mfds_recall_Efficia_DFM100",
              "https://apis.data.go.kr/1471000/MdlpRtrvlSleStpgeInfoService04",
              "getTypeNameList04",
              mfds_recall,
              pageNo=1,
              numOfRows=10,
              type_name="Efficia DFM100",
          )
          PY
