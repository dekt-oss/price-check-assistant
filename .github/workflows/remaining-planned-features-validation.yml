name: Remaining Planned Features Validation

on:
  push:
    branches:
      - "feat/workspace-v3-phase2-retry-ux"

concurrency:
  group: remaining-planned-features-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install OCR system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Remaining feature contracts
        run: |
          pytest -q tests/test_mfds_recall.py tests/test_safety_support.py tests/test_purchase_workspace_safety_contract.py tests/test_quote_item_intelligence.py tests/test_web_public_catalog.py tests/test_manufacturer_public_catalog.py tests/test_quote_multi_item_partial_failure.py
      - name: Streamlit startup smoke
        run: pytest -q tests/test_streamlit_startup_smoke.py
      - name: Full pytest
        run: pytest -q
