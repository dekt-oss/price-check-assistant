name: Track B R2 Ground Truth Capture

on:
  pull_request:
    paths:
      - ".github/workflows/track-b-r2-ground-truth-capture.yml"
      - "src/purchase_price/scripts/capture_track_b_r2_ground_truth.py"
      - "src/purchase_price/services/match_benchmark.py"
      - "data/phase0_products.csv"
      - "data/phase0_match_ground_truth.csv"
  workflow_dispatch:
    inputs:
      max_per_model:
        description: Maximum unique public candidates per benchmark model
        required: true
        default: "10"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install read-only capture dependencies
        run: >-
          python -m pip install
          "sqlalchemy>=2,<3"
          "pydantic>=2.8,<3"
          "pydantic-settings>=2.4,<3"
          "boto3>=1.35,<2"

      - name: Capture public candidates from current R2 serving index
        run: >-
          python -m purchase_price.scripts.capture_track_b_r2_ground_truth
          --max-per-model "${{ inputs.max_per_model || '10' }}"
          --output artifacts/r2-ground-truth/candidates.csv
          --summary-output artifacts/r2-ground-truth/summary.json

      - name: Print safe public candidate summary
        run: |
          python - <<'PY'
          import csv
          import json
          from collections import defaultdict
          from pathlib import Path

          summary = json.loads(Path("artifacts/r2-ground-truth/summary.json").read_text())
          print("model_count=", summary["model_count"])
          print("models_with_candidates=", summary["models_with_candidates"])
          print("candidate_row_count=", summary["candidate_row_count"])
          print(
              "existing_ground_truth_pairs_excluded=",
              summary["existing_ground_truth_pairs_excluded"],
          )
          print(
              "models_without_candidates=",
              ",".join(summary["models_without_candidates"]) or "-",
          )

          grouped = defaultdict(list)
          with Path("artifacts/r2-ground-truth/candidates.csv").open(
              encoding="utf-8-sig", newline=""
          ) as handle:
              for row in csv.DictReader(handle):
                  grouped[row["benchmark_model"]].append(row)

          for model in sorted(grouped):
              print(f"MODEL {model} candidates={len(grouped[model])}")
              for row in grouped[model][:3]:
                  print(
                      "  - basis={basis} source={source} title={title}".format(
                          basis=row["candidate_match_basis"],
                          source=row["source_record_id"],
                          title=row["candidate_title"][:240],
                      )
                  )
          PY

      - name: Upload human-review candidate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-b-r2-ground-truth-candidates
          path: artifacts/r2-ground-truth/
          retention-days: 14
          if-no-files-found: error
