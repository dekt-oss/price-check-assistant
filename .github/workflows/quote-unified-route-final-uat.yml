name: Quote Unified Route Final Production UAT

on:
  push:
    branches:
      - "uat/quote-unified-route-final"

permissions:
  contents: read

jobs:
  uat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install UAT dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright openpyxl
          python -m playwright install --with-deps chromium
      - name: Run quote unified-route UAT
        env:
          PRODUCTION_URL: https://bp-price-research.streamlit.app/
        run: python scripts/production_quote_unified_route_uat.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quote-unified-route-final-uat
          path: artifacts/quote-unified-route-uat/
          retention-days: 14
