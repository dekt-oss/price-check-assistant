name: MFDS Item Status Index

on:
  pull_request:
    paths:
      - ".github/workflows/mfds-item-status-index.yml"
      - "src/purchase_price/scripts/sync_mfds_item_status_index.py"
      - "src/purchase_price/services/mfds_item_status_index.py"
      - "tests/test_mfds_item_status_index.py"
  schedule:
    # Four slots per day. A first 형명 cycle that has started keeps running in every slot;
    # after the first verified cycle the planner refreshes weekly (Sunday).
    # Measured 2026-10-05: ~33 min per 600-page chunk, so 3 chunks fit the 115-minute limit.
    - cron: "47 3 * * *"
    - cron: "47 9 * * *"
    - cron: "47 15 * * *"
    - cron: "47 21 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Start even if the identity backfill is not verified yet
        type: boolean
        default: false
      chunks:
        description: Checkpointed chunks in this run (~33 min each)
        default: "3"
      pages_per_chunk:
        description: 500-row pages per chunk
        default: "600"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('mfds-item-status-pr-{0}', github.event.pull_request.number) || 'mfds-item-status-index' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pytest -q tests/test_mfds_item_status_index.py

  collect-and-publish:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      PYTHONPATH: src
      MFDS_SERVICE_KEY: ${{ secrets.MFDS_SERVICE_KEY }}
      MFDS_RECALL_SERVICE_KEY: ${{ secrets.MFDS_RECALL_SERVICE_KEY }}
      DATA_GO_KR_MARKET_SERVICE_KEY: ${{ secrets.DATA_GO_KR_MARKET_SERVICE_KEY }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      G2B_RESEARCH_SERVICE_KEY: ${{ secrets.G2B_RESEARCH_SERVICE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      CHUNKS: ${{ inputs.chunks || '3' }}
      PAGES_PER_CHUNK: ${{ inputs.pages_per_chunk || '600' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          mkdir -p artifacts/mfds-item-status
          python -m purchase_price.scripts.sync_mfds_item_status_index plan \
            --event-name "$GITHUB_EVENT_NAME" \
            ${{ inputs.force && '--force' || '' }} \
            --output artifacts/mfds-item-status/plan.json
          python -c "import json,os; d=json.load(open('artifacts/mfds-item-status/plan.json')); open(os.environ['GITHUB_OUTPUT'],'a').write('run=' + ('true' if d['run'] else 'false') + '\n')"
      - name: Collect 형명 pages in checkpointed chunks
        if: ${{ steps.plan.outputs.run == 'true' }}
        run: |
          set -euo pipefail
          for chunk in $(seq 1 "$CHUNKS"); do
            echo "::group::chunk $chunk/$CHUNKS"
            output="artifacts/mfds-item-status/sync-$chunk.json"
            python -m purchase_price.scripts.sync_mfds_item_status_index sync \
              --max-pages "$PAGES_PER_CHUNK" --output "$output"
            status="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$output")"
            done_cycle="$(python -c 'import json,sys; print(str(bool(json.load(open(sys.argv[1])).get("cycle_completed"))).lower())' "$output")"
            echo "::endgroup::"
            if [ "$status" != "SUCCESS" ]; then
              echo "::warning::Stopping after chunk $chunk with status=$status; the next run resumes from the saved page."
              break
            fi
            if [ "$done_cycle" = "true" ]; then
              echo "::notice::MFDS 형명 cycle completed."
              break
            fi
          done
      - name: Print status
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          plan = Path("artifacts/mfds-item-status/plan.json")
          if plan.exists():
              print("plan=", json.loads(plan.read_text()))
          reports = [json.loads(p.read_text()) for p in sorted(Path("artifacts/mfds-item-status").glob("sync-*.json"))]
          if reports:
              last = reports[-1]
              print("statuses=", ",".join(str(r.get("status")) for r in reports))
              print("pages_collected=", sum(int(r.get("pages_collected") or 0) for r in reports))
              for key in ("next_page", "item_count", "domestic_active_count", "source_total_count",
                          "verified_complete_cycles", "cycle_rows_seen"):
                  print(f"{key}=", last.get(key))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mfds-item-status
          path: artifacts/mfds-item-status/
          retention-days: 14
          if-no-files-found: warn
