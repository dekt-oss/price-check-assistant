name: G2B Market Sources Live Acceptance

on:
  pull_request:
    paths:
      - "src/purchase_price/config.py"
      - "src/purchase_price/services/g2b_market_*.py"
      - "src/purchase_price/services/g2b_contract_research.py"
      - "src/purchase_price/services/market_research.py"
      - "src/purchase_price/services/live_smoke.py"
      - "src/purchase_price/services/runtime_readiness.py"
      - "src/purchase_price/scripts/probe_g2b_market_sources.py"
      - "src/purchase_price/scripts/probe_g2b_contract_notice.py"
      - "pages/14_운영환경_진단.py"
      - "data/g2b_research_terms.csv"
      - ".github/workflows/g2b-market-sources-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anesthesia-research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      G2B_RESEARCH_SERVICE_KEY: ${{ secrets.G2B_RESEARCH_SERVICE_KEY }}
      DATA_GO_KR_MARKET_SERVICE_KEY: ${{ secrets.DATA_GO_KR_MARKET_SERVICE_KEY }}
      G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Run bounded live anesthesia research
        if: env.G2B_RESEARCH_SERVICE_KEY != '' || env.DATA_GO_KR_MARKET_SERVICE_KEY != '' || env.G2B_SERVICE_KEY != '' || env.DATA_GO_KR_SERVICE_KEY != ''
        run: |
          python -m purchase_price.scripts.probe_g2b_market_sources \
            --keyword "마취" \
            --lookback-days 30 \
            --timeout-seconds 15 \
            --max-retries 1 \
            --output artifacts/g2b-market-sources-live/report.json

      - name: Run known-positive contract notice lookup
        if: env.G2B_RESEARCH_SERVICE_KEY != '' || env.DATA_GO_KR_MARKET_SERVICE_KEY != '' || env.G2B_SERVICE_KEY != '' || env.DATA_GO_KR_SERVICE_KEY != ''
        run: |
          python -m purchase_price.scripts.probe_g2b_contract_notice \
            --bid-notice-no "20160234982" \
            --timeout-seconds 15 \
            --max-retries 1 \
            --output artifacts/g2b-market-sources-live/contract-report.json

      - name: Record missing secret
        if: env.G2B_RESEARCH_SERVICE_KEY == '' && env.DATA_GO_KR_MARKET_SERVICE_KEY == '' && env.G2B_SERVICE_KEY == '' && env.DATA_GO_KR_SERVICE_KEY == ''
        run: |
          mkdir -p artifacts/g2b-market-sources-live
          cat > artifacts/g2b-market-sources-live/report.json <<'JSON'
          {
            "validation_status": "not_configured",
            "keyword": "마취",
            "key_source": "미설정",
            "message": "G2B research service key secret is not configured; live acceptance was not measured."
          }
          JSON
          cat > artifacts/g2b-market-sources-live/contract-report.json <<'JSON'
          {
            "validation_status": "not_configured",
            "bid_notice_no": "20160234982",
            "message": "G2B research service key secret is not configured; live contract acceptance was not measured."
          }
          JSON

      - name: Print acceptance summary
        if: always()
        run: |
          if [ -f artifacts/g2b-market-sources-live/report.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/g2b-market-sources-live/report.json").read_text(encoding="utf-8"))
          print("validation_status=", report.get("validation_status"))
          print("keyword=", report.get("keyword"))
          print("key_source=", report.get("key_source"))
          for source in report.get("sources", []):
              print(
                  f"source={source.get('source')} status={source.get('status')} "
                  f"records={source.get('record_count')} requests={source.get('request_count')}"
              )
          contract_path = Path("artifacts/g2b-market-sources-live/contract-report.json")
          if contract_path.exists():
              contract = json.loads(contract_path.read_text(encoding="utf-8"))
              print("contract_validation_status=", contract.get("validation_status"))
              print("contract_bid_notice_no=", contract.get("bid_notice_no"))
              print("contract_record_count=", contract.get("record_count"))
              print("contract_matching_notice_count=", contract.get("matching_notice_count"))
          PY
          fi

      - name: Enforce live Research authorization gate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/g2b-market-sources-live/report.json")
          if not path.exists():
              raise SystemExit("live acceptance report missing")
          report = json.loads(path.read_text(encoding="utf-8"))
          status = report.get("validation_status")
          if status != "pass":
              raise SystemExit(f"G2B Research live acceptance failed: {status}")
          sources = report.get("sources", [])
          expected = {"bid_notice", "award", "prespec"}
          normal = {"success", "success_0"}
          observed = {row.get("source") for row in sources if row.get("status") in normal}
          if observed != expected:
              raise SystemExit(
                  f"G2B Research live acceptance incomplete: expected={sorted(expected)} observed={sorted(observed)}"
              )
          print("G2B Research live acceptance PASS: bid/award/prespec all returned normal responses")
          PY

      - name: Enforce known-positive contract notice gate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/g2b-market-sources-live/contract-report.json")
          if not path.exists():
              raise SystemExit("live contract acceptance report missing")
          report = json.loads(path.read_text(encoding="utf-8"))
          if report.get("validation_status") != "pass":
              raise SystemExit(
                  f"G2B contract live acceptance failed: {report.get('validation_status')} "
                  f"error={report.get('error_type')} {report.get('error_message')}"
              )
          if int(report.get("matching_notice_count") or 0) < 1:
              raise SystemExit("G2B contract live acceptance returned no record linked to known notice")
          print("G2B contract live acceptance PASS: official ntceNo lookup returned linked contract data")
          PY

      - name: Upload live acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2b-market-sources-live
          path: artifacts/g2b-market-sources-live/
          if-no-files-found: warn
          retention-days: 14
