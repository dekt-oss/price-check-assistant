name: Safety Source Isolation Validation

on:
  push:
    branches:
      - "fix/safety-source-isolation-production"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install OCR system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Focused contracts
        run: |
          pytest -q tests/test_purchase_workspace_safety_contract.py tests/test_mfds_recall.py tests/test_purchase_workspace_handoff.py tests/test_quote_item_intelligence.py
      - name: Streamlit startup
        run: pytest -q tests/test_streamlit_startup_smoke.py
      - name: Full pytest
        run: pytest -q
