name: Phase 0 Live Validation

on:
  workflow_dispatch:
    inputs:
      begin_date:
        description: "조회 시작일 YYYYMMDD"
        required: true
        default: "20260714"
      end_date:
        description: "조회 종료일 YYYYMMDD"
        required: true
        default: "20260813"
      max_pages:
        description: "verified 품목당 최대 페이지 (100행/페이지)"
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify secret
        shell: bash
        run: |
          if [ -z "$DATA_GO_KR_SERVICE_KEY" ]; then
            echo "DATA_GO_KR_SERVICE_KEY secret is not configured"
            exit 2
          fi

      - name: Run Phase 0 validation
        run: |
          python -m purchase_price.scripts.run_phase0_validation \
            --begin-date "${{ inputs.begin_date }}" \
            --end-date "${{ inputs.end_date }}" \
            --max-pages "${{ inputs.max_pages }}" \
            --output-dir artifacts/phase0-validation

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-validation-report
          path: artifacts/phase0-validation/
          retention-days: 14
          if-no-files-found: error
