name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

      - name: Temporary medical benchmark source-hit smoke
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$DATA_GO_KR_SERVICE_KEY" ]; then
            echo "DATA_GO_KR_SERVICE_KEY secret is not available"
            exit 2
          fi
          NORMALIZED_KEY="$(python -c 'import os, urllib.parse; print(urllib.parse.unquote(os.environ["DATA_GO_KR_SERVICE_KEY"]))')"
          OUT='/tmp/g2b-ventilator.json'
          curl -4 -sS --fail \
            --connect-timeout 8 --max-time 25 \
            --get \
            --data-urlencode "serviceKey=$NORMALIZED_KEY" \
            --data-urlencode 'pageNo=1' \
            --data-urlencode 'numOfRows=10' \
            --data-urlencode 'type=json' \
            --data-urlencode 'inqryDiv=1' \
            --data-urlencode 'inqryBgnDate=20260714' \
            --data-urlencode 'inqryEndDate=20260813' \
            --data-urlencode 'inqryPrdctDiv=2' \
            --data-urlencode 'fnlCntrctDlvrReqChgOrdYn=Y' \
            --data-urlencode 'dtilPrdctClsfcNoNm=인공호흡기' \
            'https://apis.data.go.kr/1230000/at/ShoppingMallPrdctInfoService/getSpcifyPrdlstPrcureInfoList' \
            -o "$OUT"

          OUT="$OUT" python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["OUT"]).read_text(encoding="utf-8"))
          if "OpenAPI_ServiceResponse" in payload:
              raise SystemExit(f"API error: {payload['OpenAPI_ServiceResponse']}")
          response = payload.get("response", {})
          header = response.get("header", {})
          body = response.get("body", {})
          items = body.get("items") or []
          if isinstance(items, dict):
              items = items.get("item", items)
          if isinstance(items, dict):
              items = [items]
          names = [item.get("prdctIdntNoNm") for item in items[:10] if isinstance(item, dict)]
          print(
              f"SMOKE term=인공호흡기 resultCode={header.get('resultCode')} "
              f"totalCount={body.get('totalCount')} sample_names={names}"
          )
          PY
