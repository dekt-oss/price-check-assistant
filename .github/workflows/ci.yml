name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

      - name: Temporary G2B auth diagnostics
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -u
          if [ -z "$DATA_GO_KR_SERVICE_KEY" ]; then
            echo "DATA_GO_KR_SERVICE_KEY secret is not available"
            exit 2
          fi

          NORMALIZED_KEY="$(python -c 'import os, urllib.parse; print(urllib.parse.unquote(os.environ["DATA_GO_KR_SERVICE_KEY"]))')"

          echo "authenticated_api_response:"
          STATUS="$(curl -4 -sS -o /tmp/g2b-auth.out \
            --connect-timeout 8 --max-time 20 \
            -w '%{http_code}' \
            --get \
            --data-urlencode "serviceKey=$NORMALIZED_KEY" \
            --data-urlencode 'pageNo=1' \
            --data-urlencode 'numOfRows=1' \
            --data-urlencode 'type=json' \
            'https://apis.data.go.kr/1230000/at/ShoppingMallPrdctInfoService/getShoppingMallPrdctInfoList')"
          echo "http=$STATUS"
          head -c 1200 /tmp/g2b-auth.out 2>/dev/null || true
          echo

          if [ "$STATUS" != "200" ]; then
            exit 3
          fi
