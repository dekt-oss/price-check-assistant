name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: CI uses no secrets or external APIs, so it is safe to run on
  # pull requests stacked on feature branches as well as on those targeting main.
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install OCR system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-kor \
            tesseract-ocr-eng
          tesseract --version | head -n 1
          tesseract --list-langs | grep -Fx kor
          tesseract --list-langs | grep -Fx eng

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Streamlit page startup smoke
        run: pytest -q tests/test_streamlit_startup_smoke.py

      - name: Pytest including real PDF/OCR E2E
        run: pytest -q

      - name: Match benchmark (fails on any grade mismatch against ground truth)
        run: |
          python -m purchase_price.scripts.evaluate_match_benchmark \
            --fail-on-mismatch \
            --output artifacts/match-benchmark-predictions.csv \
            --summary-output artifacts/match-benchmark-summary.json

      - name: Phase 0 offline integration check
        run: |
          python -m purchase_price.scripts.run_phase0_validation \
            --offline \
            --begin-date 20260714 \
            --end-date 20260813 \
            --output-dir artifacts/phase0-validation-offline

      - name: Controlled UAT deterministic offline gate
        run: |
          python -m purchase_price.scripts.run_controlled_uat \
            --fail-on-blocker \
            --output-dir artifacts/controlled-uat-offline

      - name: Upload benchmark predictions
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: match-benchmark-predictions
          path: |
            artifacts/match-benchmark-predictions.csv
            artifacts/match-benchmark-summary.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Phase 0 offline validation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase0-validation-offline
          path: artifacts/phase0-validation-offline/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Controlled UAT offline results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: controlled-uat-offline
          path: artifacts/controlled-uat-offline/
          retention-days: 14
          if-no-files-found: ignore

  # Review E-01: Production (Streamlit Community Cloud) runs a newer Python than the 3.11 gate
  # above. This job installs requirements.txt the way the cloud does and runs the same tests on
  # Production's Python, so a dependency or behaviour change there shows up before a deploy.
  # Keep PRODUCTION_PYTHON equal to the python= value of Home.py?_memdiag=1 (RUNTIME line) and
  # to docs/operations/CURRENT_OPERATIONS.md.
  test-production-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRODUCTION_PYTHON: "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Production's Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PRODUCTION_PYTHON }}
          cache: pip

      - name: Install OCR system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            tesseract-ocr-kor \
            tesseract-ocr-eng

      - name: Install like the cloud (requirements.txt), then test tools
        run: |
          python -m pip install --upgrade pip uv
          uv pip install --system -r requirements.txt
          uv pip install --system -e ".[dev]"
          python -c "import platform, streamlit, pypdfium2, pytesseract, purchase_price; print('python', platform.python_version(), 'streamlit', streamlit.__version__)"

      - name: Pytest on Production's Python
        run: pytest -q
