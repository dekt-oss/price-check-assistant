name: Track B Supplemental Collection

on:
  pull_request:
    paths:
      - ".github/workflows/track-b-supplemental-collection.yml"
      - "src/purchase_price/scripts/run_g2b_track_b_supplemental.py"
      - "src/purchase_price/scripts/collect_g2b_track_b_r2.py"
      - "src/purchase_price/services/track_b_supplemental_state.py"
      - "src/purchase_price/services/track_b_supplemental_targets.py"
      - "src/purchase_price/scripts/sync_g2b_track_b_r2_index.py"
  schedule:
    # 19:40 UTC = 04:40 KST next day. Base Track B starts at 03:10 KST and has priority.
    # Shared concurrency serializes the jobs if the base run is still finishing.
    - cron: "40 19 * * *"
  workflow_dispatch:
    inputs:
      request_budget:
        description: Maximum G2B requests for verified supplemental codes (hard cap 100)
        required: true
        default: "25"

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('track-b-supplemental-pr-{0}', github.event.pull_request.number) || 'track-b-r2-pipeline' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  readiness:
    name: read-only supplemental readiness
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONPATH: src
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install readiness dependencies
        run: >-
          python -m pip install
          "pydantic>=2.8,<3"
          "pydantic-settings>=2.4,<3"
          "boto3>=1.35,<2"
          "httpx>=0.27,<1"
          "tenacity>=9,<10"
      - name: Verify supplemental target and R2 state contracts without writes
        run: |
          python - <<'PY'
          from purchase_price.config import Settings
          from purchase_price.services.track_b_pipeline_state import STATE_NAME, TrackBPipelineState
          from purchase_price.services.track_b_supplemental_state import (
              SUPPLEMENTAL_STATE_NAME,
              TrackBSupplementalState,
          )
          from purchase_price.services.track_b_supplemental_targets import (
              supplemental_verified_targets,
          )
          from purchase_price.storage.r2_state import R2OperationalStateStore

          settings = Settings()
          if not settings.r2_configured:
              raise SystemExit("R2 repository secret set is incomplete")
          targets = supplemental_verified_targets()
          print("supplemental_targets=", [
              {
                  "code": item.detail_product_code,
                  "name": item.detail_product_name,
                  "models": item.models,
              }
              for item in targets
          ])
          state_store = R2OperationalStateStore.from_settings(settings)
          base_payload = state_store.read_json(STATE_NAME)
          if base_payload is None:
              raise SystemExit("base Track B pipeline state is missing")
          base = TrackBPipelineState.from_payload(base_payload)
          print("base_backfill_complete=", base.backfill_complete)
          print(
              "base_cursor=",
              base.collection_cursor.code_index,
              base.collection_cursor.page_no,
          )
          supplemental_payload = state_store.read_json(SUPPLEMENTAL_STATE_NAME)
          if supplemental_payload is not None:
              supplemental = TrackBSupplementalState.from_payload(supplemental_payload)
              print("supplemental_active_mode=", supplemental.active_mode)
              print("supplemental_pending=", len(supplemental.pending_object_keys))
          else:
              print("supplemental_state=not_created")
          PY

  collect:
    name: bounded verified supplemental collection to R2
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      G2B_CATALOG_SERVICE_KEY: ${{ secrets.G2B_CATALOG_SERVICE_KEY }}
      G2B_SHOPPING_SERVICE_KEY: ${{ secrets.G2B_SHOPPING_SERVICE_KEY }}
      G2B_RESEARCH_SERVICE_KEY: ${{ secrets.G2B_RESEARCH_SERVICE_KEY }}
      DATA_GO_KR_MARKET_SERVICE_KEY: ${{ secrets.DATA_GO_KR_MARKET_SERVICE_KEY }}
      G2B_SERVICE_KEY: ${{ secrets.G2B_SERVICE_KEY }}
      DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install collection dependencies
        run: >-
          python -m pip install
          "httpx>=0.27,<1"
          "tenacity>=9,<10"
          "pydantic>=2.8,<3"
          "pydantic-settings>=2.4,<3"
          "boto3>=1.35,<2"
      - name: Run verified supplemental collection
        run: >-
          python -m purchase_price.scripts.run_g2b_track_b_supplemental
          --request-budget "${{ inputs.request_budget || '25' }}"
          --output artifacts/track-b-supplemental/collection-summary.json
      - name: Upload supplemental collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: track-b-supplemental-collection
          path: artifacts/track-b-supplemental/
          if-no-files-found: warn
          retention-days: 14
