name: Hospital Weekly Report

# Every Monday 08:00 KST: build the 부산백병원 경영 비교 리포트 (지역 경쟁군, 동일 의료원) from the
# committed KHIDI disclosure data, add the last 7 days of News Radar titles/links, optionally an
# AI paragraph written from computed numbers only, and publish it to the job summary, an artifact
# and R2 reports/v1/<date>/ (reports older than 21 days are removed: NAVER display-cache limit).

on:
  schedule:
    - cron: "0 23 * * 0"
  workflow_dispatch:
    inputs:
      hospital:
        description: 병원 ID (data/hospital_master.json)
        required: true
        default: H-BUSAN-PAIK

permissions:
  contents: read

concurrency:
  group: hospital-weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install report dependencies
        run: >-
          python -m pip install
          "pydantic>=2.8,<3"
          "pydantic-settings>=2.4,<3"
          "boto3>=1.35,<2"
          "httpx>=0.27,<1"
          "openpyxl>=3.1,<4"
          "anthropic>=1,<2"
      - name: Build the weekly report
        run: >-
          python -m purchase_price.scripts.generate_hospital_report
          --hospital "${{ inputs.hospital || 'H-BUSAN-PAIK' }}"
          --peer region --peer network
          --with-ai --with-news --r2
          --output-dir artifacts/hospital-report
          --summary-json artifacts/hospital-report/summary.json
      - name: Upload the report files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hospital-weekly-report
          path: artifacts/hospital-report/
          if-no-files-found: warn
          retention-days: 21
