name: Workspace V3 Release Gate Validation

on:
  push:
    branches:
      - "feat/workspace-v3-export-uat"

concurrency:
  group: workspace-v3-release-gate-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install OCR system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-kor tesseract-ocr-eng
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Workspace V3 release-gate contracts
        run: |
          pytest -q tests/test_workspace_v3_release_gate.py tests/test_market_survey_export.py tests/test_unified_search_state_contract.py tests/test_track_b_db_quote_comparison.py tests/test_safety_support.py tests/test_quote_uat_release_gate.py
      - name: Streamlit startup smoke
        run: pytest -q tests/test_streamlit_startup_smoke.py
      - name: Full pytest
        run: pytest -q
