[alembic]
script_location = alembic
prepend_sys_path = .
# Alembic 1.16+ warns on every run without this; older versions ignore the unknown key.
path_separator = os
sqlalchemy.url = postgresql+psycopg://purchase_user:purchase_pass@localhost:5432/purchase_price

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
